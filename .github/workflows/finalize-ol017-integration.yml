name: Finalize OL-017 Processor Integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/ol-017-reduced-semantic-input'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Verify and materialize integration test
        shell: bash
        run: |
          set -euo pipefail
          target=apps/daemon/src/semantic-input/processor.integration.test.ts
          test ! -e "$target"
          cat .github/ol017-integration/part-* > /tmp/ol017-integration.b64
          test "$(wc -c < /tmp/ol017-integration.b64)" -eq 5696
          base64 --decode /tmp/ol017-integration.b64 > /tmp/ol017-integration.ts.gz
          test "$(wc -c < /tmp/ol017-integration.ts.gz)" -eq 4271
          echo "4c856e09353a221bf79176aa6194034765e770a0d6da6519c3c8bd5b24283620  /tmp/ol017-integration.ts.gz" | sha256sum --check
          gzip --test /tmp/ol017-integration.ts.gz
          gzip --decompress --stdout /tmp/ol017-integration.ts.gz > "$target"
          test "$(wc -c < "$target")" -eq 17096
          echo "845edee18520a598530f06bf0f89a3241cda09e3899c9dc2e68c36e4a18549d8  $target" | sha256sum --check

      - name: Set up exact Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up exact pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Format integration test
        run: pnpm exec biome format --write apps/daemon/src/semantic-input/processor.integration.test.ts

      - name: Remove transfer files and verify exact scope
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/ol017-integration/part-*
          git rm .github/workflows/finalize-ol017-integration.yml
          cat > /tmp/expected-files <<'FILES'
          .github/ol017-integration/part-00
          .github/ol017-integration/part-01
          .github/workflows/finalize-ol017-integration.yml
          apps/daemon/src/semantic-input/processor.integration.test.ts
          FILES
          {
            git diff --name-only
            git diff --cached --name-only
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish OL-017 processor integration
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Test semantic-input persistence and restart boundaries"
          git push origin "HEAD:${{ github.head_ref }}"
