name: Diagnose OL-027 OL-025 merge

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Report exact three-way conflicts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git config user.name Emad211
          git config user.email 82148680+Emad211@users.noreply.github.com
          if git merge --no-commit --no-ff origin/main; then
            echo 'merge-clean=true'
            git diff --cached --name-only | LC_ALL=C sort
            git merge --abort
            exit 0
          fi
          echo 'merge-clean=false'
          echo 'conflicts-start'
          git diff --name-only --diff-filter=U | LC_ALL=C sort
          echo 'conflicts-end'
          echo 'staged-non-conflicts-start'
          git diff --cached --name-only | LC_ALL=C sort
          echo 'staged-non-conflicts-end'
          git merge --abort
