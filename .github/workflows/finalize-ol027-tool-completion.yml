name: Finalize OL-027 neutral tool completion

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Apply exact neutral completion edits
        run: python .ol027-transfer/finalize-tool-completion.py

      - run: pnpm install --frozen-lockfile

      - name: Format exact source
        run: |
          pnpm exec biome check --write \
            packages/event-model/src/normalized-event.ts \
            packages/contracts/src/verification-evidence.ts \
            packages/contracts/tests/verification-evidence-codex.test.ts \
            apps/daemon/src/persistence/tool-completion-event-taxonomy-migration.ts \
            apps/daemon/src/persistence/migration-definitions.ts \
            apps/daemon/src/persistence/migration-v20.test.ts \
            apps/daemon/src/persistence/migration-v21.test.ts \
            apps/daemon/src/normalization/processor.ts \
            apps/daemon/src/normalization/codex-normalization.test.ts \
            apps/daemon/src/verification-extraction/source.ts \
            apps/daemon/src/verification-extraction/source.test.ts \
            apps/daemon/src/verification-extraction/codex-source.test.ts \
            apps/daemon/src/verification-extraction/artifact.ts \
            apps/daemon/src/verification-extraction/processor.ts \
            apps/daemon/src/verification-extraction/processor.test.ts

      - name: Capture focused test diagnostics
        shell: bash
        run: |
          set +e
          pnpm vitest run \
            packages/event-model/tests/normalized-event.test.ts \
            packages/contracts/tests/verification-evidence-codex.test.ts \
            apps/daemon/src/persistence/migration-v20.test.ts \
            apps/daemon/src/persistence/migration-v21.test.ts \
            apps/daemon/src/normalization/codex-normalization.test.ts \
            apps/daemon/src/normalization/processor.test.ts \
            apps/daemon/src/verification-extraction/source.test.ts \
            apps/daemon/src/verification-extraction/codex-source.test.ts \
            apps/daemon/src/verification-extraction/recognizer.test.ts \
            apps/daemon/src/verification-extraction/processor.test.ts \
            > /tmp/ol027-tool-completion-tests.log 2>&1
          code=$?
          printf '%s\n' "$code" > /tmp/ol027-tool-completion-tests.exit
          cat /tmp/ol027-tool-completion-tests.log
          exit 0

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ol027-tool-completion-tests
          path: |
            /tmp/ol027-tool-completion-tests.log
            /tmp/ol027-tool-completion-tests.exit
          if-no-files-found: error
          retention-days: 1
