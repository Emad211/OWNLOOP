name: Finalize OL-027 runtime capability projection

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Apply exact runtime capability wiring
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b0a3250fd26b56250a8e62cd547c4ba5cb7c764c"
          python .ol027-transfer/finalize-runtime-capability.py
          rm -rf .ol027-transfer .github/workflows/finalize-ol027-runtime-capability.yml

      - run: pnpm install --frozen-lockfile

      - name: Format runtime capability source
        run: |
          pnpm exec biome check --write \
            packages/contracts/src/codex-capability.ts \
            packages/contracts/tests/codex-capability.test.ts \
            apps/daemon/src/persistence/repositories/codex-capability.ts \
            apps/daemon/src/persistence/index.ts \
            apps/daemon/src/codex-capability/projector.ts \
            apps/daemon/src/codex-capability/projector.test.ts \
            apps/daemon/src/codex-capability/index.ts \
            apps/daemon/src/index.ts

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test runtime capability projection
        run: |
          pnpm vitest run \
            packages/contracts/tests/codex-capability.test.ts \
            packages/contracts/tests/codex-hook-configuration.test.ts \
            apps/daemon/src/codex-capability/projector.test.ts \
            apps/daemon/src/persistence/prepared-agent-ingress.test.ts

      - name: Test full repository
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish clean runtime capability head
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .ol027-transfer
          test ! -e .github/workflows/finalize-ol027-runtime-capability.yml
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name 'Emad211'
          git config user.email '82148680+Emad211@users.noreply.github.com'
          git commit -m 'OL-027: Project privacy-bounded Codex capability'
          git push origin "HEAD:${{ github.head_ref }}"
