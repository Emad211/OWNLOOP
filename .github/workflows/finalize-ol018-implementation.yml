name: Finalize OL-018 Implementation

# Owner-authorized execution after checksum-verified part correction.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/ol-018-provider-candidate-generation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Verify and apply exact OL-018 patches
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'abc0eb4ee3dfec75ee26c8a0c9e4a2667122ff618f498c70910990a229e6e82b  .github/ol018-fresh/part-00' \
            'f18b65172cfbff4ff6ae2c859a26ba48b73b74d707852ce29301265b553ab45f  .github/ol018-fresh/part-01' \
            '86230616ab8b7e1d48061517f179e4377d49a97317611c82fcde909f0efca1a9  .github/ol018-fresh/part-02' \
            '31b68ed7331365e067f0c163522444c22455f1cbc412db9e9f2304e2cb09fd72  .github/ol018-fresh/part-03' \
            'aa63048cf67afba0da446e6fd22fc13edbebb32fbe165057ff94f8c14eab769a  .github/ol018-fresh/part-04' \
            'de8a8272d5f4b206532cfcc6a83687aec15f2b169df4e81cd22e7156c1b2e397  .github/ol018-fresh/part-05' \
            '4967b2320f913f54568a9f22085d97d1d16882e5e5bf93979110db33f3c38ba4  .github/ol018-fresh/part-06' \
            | sha256sum --check --strict
          test "$(wc -c < .github/ol018-fresh/part-00)" -eq 6000
          test "$(wc -c < .github/ol018-fresh/part-01)" -eq 6000
          test "$(wc -c < .github/ol018-fresh/part-02)" -eq 6000
          test "$(wc -c < .github/ol018-fresh/part-03)" -eq 6000
          test "$(wc -c < .github/ol018-fresh/part-04)" -eq 6000
          test "$(wc -c < .github/ol018-fresh/part-05)" -eq 6000
          test "$(wc -c < .github/ol018-fresh/part-06)" -eq 572

          cat .github/ol018-fresh/part-* > /tmp/ol018-fresh.b64
          test "$(wc -c < /tmp/ol018-fresh.b64)" -eq 36572
          echo '5380c9b19aba3ec497dc78ee3afc152ec2ee94ec20635d0fe2f9ae6d12887265  /tmp/ol018-fresh.b64' | sha256sum --check

          base64 --decode /tmp/ol018-fresh.b64 > /tmp/ol018-fresh.patch.gz
          test "$(wc -c < /tmp/ol018-fresh.patch.gz)" -eq 27427
          echo '2cd83f97e377f88c85a48ceb6f7c9aa08f3fa8b3d483418ad0b39d7dcabde847  /tmp/ol018-fresh.patch.gz' | sha256sum --check
          gzip --test /tmp/ol018-fresh.patch.gz

          gzip --decompress --stdout /tmp/ol018-fresh.patch.gz > /tmp/ol018-fresh.patch
          test "$(wc -c < /tmp/ol018-fresh.patch)" -eq 133785
          echo '55b88c1a81b86663bb5153ab666f3c29325b477e0bfe290907605186c90593be  /tmp/ol018-fresh.patch' | sha256sum --check
          git apply --check /tmp/ol018-fresh.patch
          git apply /tmp/ol018-fresh.patch

          lint_fix=.github/ol018-fixes/lint.patch
          test "$(wc -c < "$lint_fix")" -eq 1592
          echo '1fed1e324ad0be09e4ecc607fb9d27d2722d2c974b2315f2599fe82ec525572b  .github/ol018-fixes/lint.patch' | sha256sum --check
          git apply --check "$lint_fix"
          git apply "$lint_fix"

      - name: Set up exact Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up exact pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Format OL-018 source
        run: pnpm format

      - name: Remove transfer files and verify exact scope
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/ol018-fresh/part-*
          git rm .github/ol018-transfer/part-*
          git rm .github/ol018-fixes/lint.patch
          git rm .github/workflows/recover-ol018-transfer-tail.yml
          git rm .github/workflows/finalize-ol018-implementation.yml

          cat > /tmp/expected-files <<'FILES'
          .github/ol018-fixes/lint.patch
          .github/ol018-fresh/part-00
          .github/ol018-fresh/part-01
          .github/ol018-fresh/part-02
          .github/ol018-fresh/part-03
          .github/ol018-fresh/part-04
          .github/ol018-fresh/part-05
          .github/ol018-fresh/part-06
          .github/ol018-transfer/part-00
          .github/ol018-transfer/part-01
          .github/ol018-transfer/part-02
          .github/ol018-transfer/part-03
          .github/ol018-transfer/part-04
          .github/workflows/export-ol018-source.yml
          .github/workflows/finalize-ol018-implementation.yml
          .github/workflows/recover-ol018-transfer-tail.yml
          AGENTS.md
          README.md
          apps/daemon/src/candidate-generation/README.md
          apps/daemon/src/candidate-generation/adapter.test.ts
          apps/daemon/src/candidate-generation/adapter.ts
          apps/daemon/src/candidate-generation/artifact.test.ts
          apps/daemon/src/candidate-generation/artifact.ts
          apps/daemon/src/candidate-generation/constants.ts
          apps/daemon/src/candidate-generation/endpoint.ts
          apps/daemon/src/candidate-generation/index.ts
          apps/daemon/src/candidate-generation/processor.test.ts
          apps/daemon/src/candidate-generation/processor.ts
          apps/daemon/src/candidate-generation/request.test.ts
          apps/daemon/src/candidate-generation/request.ts
          apps/daemon/src/candidate-generation/schema.ts
          apps/daemon/src/candidate-generation/test-fixture.ts
          apps/daemon/src/candidate-generation/transport.test.ts
          apps/daemon/src/candidate-generation/transport.ts
          apps/daemon/src/index.ts
          apps/daemon/src/persistence/index.ts
          apps/daemon/src/persistence/migration-definitions.ts
          apps/daemon/src/persistence/migrations.test.ts
          apps/daemon/src/persistence/repositories/candidate-generations.ts
          apps/daemon/src/semantic-input/processor.ts
          docs/adr/0020-provider-backed-candidate-generation-boundary.md
          packages/contracts/src/candidate-generation.ts
          packages/contracts/src/index.ts
          packages/contracts/tests/candidate-generation.test.ts
          packages/contracts/tests/index.test.ts
          FILES

          {
            git diff --name-only
            git diff --cached --name-only
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish OL-018 implementation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement provider-backed Candidate generation boundary'
          git push origin "HEAD:${{ github.head_ref }}"
