name: Finalize OL-027 Codex evidence pipeline

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Lock exact test parent
        run: test "$(git rev-parse HEAD^)" = "5d5c5c12af12b7daa22a70ba9acae46ef3db7f27"

      - run: pnpm install --frozen-lockfile

      - name: Format integration test
        run: pnpm exec biome check --write apps/daemon/src/codex-end-to-end.integration.test.ts

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test real Codex evidence pipeline
        run: pnpm vitest run apps/daemon/src/codex-end-to-end.integration.test.ts

      - name: Test full repository
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish clean integration head
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-ol027-codex-e2e.yml
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name 'Emad211'
          git config user.email '82148680+Emad211@users.noreply.github.com'
          git commit -m 'OL-027: Verify the real Codex evidence pipeline'
          git push origin "HEAD:${{ github.head_ref }}"
