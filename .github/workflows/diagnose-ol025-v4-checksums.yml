name: Diagnose OL-025 package fix chain

on:
  pull_request:
    branches:
      - agent/ol025-package-diagnosis-base

permissions:
  contents: read

jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Reconstruct exact source and test candidate chains
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          original_b64 = b''.join(
              (Path('.ol025-transfer') / f'chunk-{index:02d}.txt').read_bytes()
              for index in range(13)
          )
          original = gzip.decompress(base64.b64decode(original_b64, validate=True))
          if len(original) != 307654 or hashlib.sha256(original).hexdigest() != '81e01d5427b5dc75b1fab53d00824521b77aafcf9be4b90397dc388cd02d7fc9':
              raise SystemExit('original patch mismatch')
          Path('/tmp/ol025.patch').write_bytes(original)

          candidates = {
              'fix': Path('.ol025-diagnosis/package-fix.patch').read_bytes(),
              'v3': Path('.ol025-diagnosis/package-fix-v3.patch').read_bytes(),
              'v4direct': Path('.ol025-diagnosis/package-fix-v4.patch').read_bytes(),
              'v4chunk': base64.b64decode(
                  b''.join(path.read_bytes() for path in sorted(Path('.ol025-diagnosis/v4-chunks').glob('chunk-*.txt'))),
                  validate=True,
              ),
              'v3v4': base64.b64decode(
                  b''.join(path.read_bytes() for path in sorted(Path('.ol025-diagnosis/v3v4-chunks').glob('chunk-*.txt'))),
                  validate=True,
              ),
          }
          for name, data in candidates.items():
              path = Path(f'/tmp/{name}.patch')
              path.write_bytes(data)
              print(f'{name} size={len(data)} sha256={hashlib.sha256(data).hexdigest()}')
          PY

          git apply --check /tmp/ol025.patch
          git apply /tmp/ol025.patch
          git add -A
          git -c user.name=diagnostic -c user.email=diagnostic@example.invalid commit -m 'temporary reconstructed OL-025 source'
          baseline="$(git rev-parse HEAD)"

          chains=(
            'fix'
            'v3'
            'v3v4'
            'v3,v3v4'
            'v3,v4chunk'
            'v3,v4direct'
            'fix,v3'
            'fix,v4chunk'
            'fix,v4direct'
            'fix,v3v4'
            'v3v4,v4chunk'
            'v3v4,v4direct'
          )

          for chain in "${chains[@]}"; do
            git reset --hard "$baseline" >/dev/null
            git clean -fd >/dev/null
            ok=true
            failed=''
            IFS=',' read -r -a parts <<< "$chain"
            for part in "${parts[@]}"; do
              if git apply --recount --check "/tmp/${part}.patch" >/tmp/apply.stdout 2>/tmp/apply.stderr; then
                git apply --recount "/tmp/${part}.patch"
              else
                ok=false
                failed="$part"
                break
              fi
            done
            key="${chain//,/_then_}"
            if [ "$ok" = true ]; then
              git diff --check
              git diff --name-only | LC_ALL=C sort > "/tmp/${key}.files"
              git diff --binary --full-index > "/tmp/${key}.canonical.patch"
              echo "chain=${chain} applies=true canonical-size=$(wc -c < "/tmp/${key}.canonical.patch") canonical-sha256=$(sha256sum "/tmp/${key}.canonical.patch" | cut -d' ' -f1)"
              echo "files=${chain}"
              cat "/tmp/${key}.files"
            else
              error="$(tr '\n' ' ' </tmp/apply.stderr | sed 's/[[:space:]]\+/ /g')"
              echo "chain=${chain} applies=false failed=${failed} error=${error}"
            fi
          done
