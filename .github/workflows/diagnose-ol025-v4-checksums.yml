name: Diagnose OL-025 v4 checksums

on:
  pull_request:
    branches:
      - agent/ol025-package-diagnosis-base

permissions:
  contents: read

jobs:
  checksums:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Reconstruct and recount both v4 candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          original_b64 = b''.join(
              (Path('.ol025-transfer') / f'chunk-{index:02d}.txt').read_bytes()
              for index in range(13)
          )
          original = gzip.decompress(base64.b64decode(original_b64, validate=True))
          if len(original) != 307654 or hashlib.sha256(original).hexdigest() != '81e01d5427b5dc75b1fab53d00824521b77aafcf9be4b90397dc388cd02d7fc9':
              raise SystemExit('original patch mismatch')
          Path('/tmp/ol025.patch').write_bytes(original)

          chunk_payload = b''.join(
              path.read_bytes()
              for path in sorted(Path('.ol025-diagnosis/v4-chunks').glob('chunk-*.txt'))
          )
          chunk_patch = base64.b64decode(chunk_payload, validate=True)
          direct_patch = Path('.ol025-diagnosis/package-fix-v4.patch').read_bytes()
          Path('/tmp/chunk-v4.patch').write_bytes(chunk_patch)
          Path('/tmp/direct-v4.patch').write_bytes(direct_patch)
          print(f'chunk-patch size={len(chunk_patch)} sha256={hashlib.sha256(chunk_patch).hexdigest()}')
          print(f'direct-patch size={len(direct_patch)} sha256={hashlib.sha256(direct_patch).hexdigest()}')
          PY

          git apply --check /tmp/ol025.patch
          git apply /tmp/ol025.patch
          git add -A
          git -c user.name=diagnostic -c user.email=diagnostic@example.invalid commit -m 'temporary reconstructed OL-025 source'

          for candidate in chunk direct; do
            patch="/tmp/${candidate}-v4.patch"
            if git apply --recount --check "$patch"; then
              echo "${candidate}-v4-recount-applies=true"
              git apply --recount "$patch"
              git diff --check
              git diff --name-only | LC_ALL=C sort > "/tmp/${candidate}.files"
              git diff --binary --full-index > "/tmp/${candidate}.canonical.patch"
              printf '%s-canonical-size=%s\n' "$candidate" "$(wc -c < "/tmp/${candidate}.canonical.patch")"
              printf '%s-canonical-sha256=%s\n' "$candidate" "$(sha256sum "/tmp/${candidate}.canonical.patch" | cut -d' ' -f1)"
              echo "${candidate}-files-start"
              cat "/tmp/${candidate}.files"
              echo "${candidate}-files-end"
              git reset --hard HEAD
              git clean -fd
            else
              echo "${candidate}-v4-recount-applies=false"
            fi
          done

          if cmp -s /tmp/chunk.canonical.patch /tmp/direct.canonical.patch; then
            echo 'canonical-candidates-equal=true'
          else
            echo 'canonical-candidates-equal=false'
            diff -u /tmp/chunk.files /tmp/direct.files || true
          fi
