name: Finalize OL-027 capability and Hook configuration

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Apply exact capability and Hook configuration edits
        run: python .ol027-transfer/run-capability-config-finalizer.py

      - run: pnpm install --frozen-lockfile

      - name: Format exact source
        run: |
          pnpm exec biome check --write \
            packages/contracts/src/codex-capability.ts \
            packages/contracts/src/codex-hook-configuration.ts \
            packages/contracts/src/codex.ts \
            packages/contracts/tests/codex-capability.test.ts \
            packages/contracts/tests/codex-hook-configuration.test.ts

      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          pnpm typecheck > /tmp/ol027-capability-typecheck.log 2>&1
          code=$?
          printf '%s\n' "$code" > /tmp/ol027-capability-typecheck.exit
          cat /tmp/ol027-capability-typecheck.log
          exit 0

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ol027-capability-typecheck
          path: |
            /tmp/ol027-capability-typecheck.log
            /tmp/ol027-capability-typecheck.exit
          if-no-files-found: error
          retention-days: 1
