name: Finalize OL-027 capability and Hook configuration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Apply exact capability and Hook configuration edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7157b8c4167bd74234427afd38b5c96e2a3e39d4"
          python .ol027-transfer/run-capability-config-finalizer.py
          rm -rf .ol027-transfer .github/workflows/finalize-ol027-capability-config.yml

      - run: pnpm install --frozen-lockfile

      - name: Format capability and configuration source
        run: |
          pnpm exec biome check --write \
            packages/contracts/src/codex-capability.ts \
            packages/contracts/src/codex-hook-configuration.ts \
            packages/contracts/src/codex.ts \
            packages/contracts/tests/codex-capability.test.ts \
            packages/contracts/tests/codex-hook-configuration.test.ts

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test capability and Hook configuration boundaries
        run: |
          pnpm vitest run \
            packages/contracts/tests/codex-capability.test.ts \
            packages/contracts/tests/codex-hook-configuration.test.ts \
            packages/contracts/tests/codex-hook-payloads.test.ts \
            packages/contracts/tests/codex-ingress-wrapper.test.ts \
            packages/contracts/tests/codex-ingress-security.test.ts

      - name: Test full repository
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish clean capability head
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .ol027-transfer
          test ! -e .github/workflows/finalize-ol027-capability-config.yml
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name 'Emad211'
          git config user.email '82148680+Emad211@users.noreply.github.com'
          git commit -m 'OL-027: Add Codex capability and Hook configuration core'
          git push origin "HEAD:${{ github.head_ref }}"
