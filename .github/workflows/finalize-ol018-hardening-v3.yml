name: Finalize OL-018 Hardening V3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/ol-018-provider-candidate-generation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Verify and apply exact hardening
        run: bash .github/ol018-hardening-v3/verify-and-apply.sh

      - name: Set up exact Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up exact pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Format hardening source
        run: pnpm format

      - name: Remove transfer files and verify scope
        run: bash .github/ol018-hardening-v3/cleanup-and-verify.sh

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Capture typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck > /tmp/ol018-hardening-typecheck.log 2>&1
          printf '%s\n' "$?" > /tmp/ol018-hardening-typecheck.status
          exit 0

      - name: Upload typecheck diagnostic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ol018-hardening-typecheck
          path: |
            /tmp/ol018-hardening-typecheck.log
            /tmp/ol018-hardening-typecheck.status
          if-no-files-found: error
          retention-days: 1

      - name: Require typecheck
        shell: bash
        run: test "$(cat /tmp/ol018-hardening-typecheck.status)" -eq 0

      - name: Capture tests
        shell: bash
        run: |
          set +e
          pnpm test > /tmp/ol018-hardening-tests.log 2>&1
          printf '%s\n' "$?" > /tmp/ol018-hardening-tests.status
          exit 0

      - name: Upload test diagnostic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ol018-hardening-tests
          path: |
            /tmp/ol018-hardening-tests.log
            /tmp/ol018-hardening-tests.status
          if-no-files-found: error
          retention-days: 1

      - name: Require tests
        shell: bash
        run: test "$(cat /tmp/ol018-hardening-tests.status)" -eq 0

      - name: Build
        run: pnpm build

      - name: Publish OL-018 hardening
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden OL-018 transport and provenance invariants'
          git push origin "HEAD:${{ github.head_ref }}"
