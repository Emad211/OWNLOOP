name: Finalize OL-027 Codex security

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 3

      - name: Capture exact patch diagnostics
        shell: bash
        run: |
          set +e
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "PARENT=$(git rev-parse HEAD^)"
            echo "PATCH_SHA=$(sha256sum .ol027-transfer/codex-dedup.patch | cut -d' ' -f1)"
            echo "PATCH_SIZE=$(wc -c < .ol027-transfer/codex-dedup.patch | tr -d ' ')"
            git apply --numstat .ol027-transfer/codex-dedup.patch
            echo "NUMSTAT_EXIT=$?"
            git apply --check --verbose .ol027-transfer/codex-dedup.patch
            echo "CHECK_EXIT=$?"
          } > /tmp/ol027-codex-patch.log 2>&1
          cat /tmp/ol027-codex-patch.log
          exit 0

      - uses: actions/upload-artifact@v6
        with:
          name: ol027-codex-patch-diagnostics
          path: /tmp/ol027-codex-patch.log
          if-no-files-found: error
          retention-days: 1
