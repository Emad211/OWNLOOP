name: Finalize OL-027 Codex security

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Apply verified Codex deduplication patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .ol027-transfer/codex-dedup.patch | cut -d' ' -f1)" = "338471cd0e709af0f5dbe897d3234576ed569b59c0dd175b3bd9b9e8a7b579fc"
          git apply --check .ol027-transfer/codex-dedup.patch
          git apply .ol027-transfer/codex-dedup.patch

      - run: pnpm install --frozen-lockfile

      - name: Capture Biome diagnostics
        shell: bash
        run: |
          set +e
          pnpm exec biome check --write \
            packages/contracts/src/codex.ts \
            packages/contracts/src/codex-ingress-security.ts \
            packages/contracts/src/ingress-security.ts \
            packages/contracts/tests/codex-ingress-security.test.ts \
            packages/ingress-security/src/codex-fingerprint.ts \
            packages/ingress-security/src/codex-prepare.ts \
            packages/ingress-security/src/codex-reduction.ts \
            packages/ingress-security/src/index.ts \
            packages/ingress-security/tests/codex-prepare.test.ts \
            > /tmp/ol027-biome.log 2>&1
          code=$?
          printf '%s\n' "$code" > /tmp/ol027-biome.exit
          cat /tmp/ol027-biome.log
          exit 0

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ol027-codex-biome-diagnostics
          path: |
            /tmp/ol027-biome.log
            /tmp/ol027-biome.exit
          if-no-files-found: error
          retention-days: 1
