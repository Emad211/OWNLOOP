name: Finalize OL-027 Codex security

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Apply exact Codex security edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "fb807f65f4b85953a8972be09d174ef18eadd621"
          test "$(git hash-object .ol027-transfer/codex-dedup.patch)" = "d9666f923ee39651c1ba78828c96b03b1b5327d0"
          git apply --check .ol027-transfer/codex-dedup.patch
          git apply .ol027-transfer/codex-dedup.patch
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/contracts/src/codex-ingress-security.ts")
          text = path.read_text(encoding="utf-8")
          old_constant = 'const controlPattern = /[\\u0000-\\u001f\\u007f]/u;\n'
          replacement = '''function hasControlCharacter(value: string): boolean {
            for (let index = 0; index < value.length; index += 1) {
              const code = value.charCodeAt(index);
              if (code <= 0x1f || code === 0x7f) return true;
            }
            return false;
          }
          '''
          if text.count(old_constant) != 1:
              raise SystemExit("expected exactly one controlPattern declaration")
          old_refinement = '.refine((value) => !controlPattern.test(value))'
          if text.count(old_refinement) != 2:
              raise SystemExit("expected exactly two controlPattern refinements")
          text = text.replace(old_constant, replacement)
          text = text.replace(old_refinement, '.refine((value) => !hasControlCharacter(value))')
          path.write_text(text, encoding="utf-8")
          PY
          rm -rf .ol027-transfer .github/workflows/finalize-ol027-codex-security.yml

      - run: pnpm install --frozen-lockfile

      - name: Format Codex security source
        run: |
          pnpm exec biome check --write \
            packages/contracts/src/codex.ts \
            packages/contracts/src/codex-ingress-security.ts \
            packages/contracts/src/ingress-security.ts \
            packages/contracts/tests/codex-ingress-security.test.ts \
            packages/ingress-security/src/codex-fingerprint.ts \
            packages/ingress-security/src/codex-prepare.ts \
            packages/ingress-security/src/codex-reduction.ts \
            packages/ingress-security/src/index.ts \
            packages/ingress-security/tests/codex-prepare.test.ts

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test Codex security boundaries
        run: pnpm vitest run packages/contracts/tests/codex-ingress-security.test.ts packages/ingress-security/tests/codex-prepare.test.ts packages/ingress-security/tests/prepare.test.ts packages/ingress-security/tests/fingerprint.test.ts

      - name: Test full repository
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish clean source head
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .ol027-transfer
          test ! -e .github/workflows/finalize-ol027-codex-security.yml
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name 'Emad211'
          git config user.email '82148680+Emad211@users.noreply.github.com'
          git commit -m 'OL-027: Add secure Codex receipt preparation'
          git push origin "HEAD:${{ github.head_ref }}"
