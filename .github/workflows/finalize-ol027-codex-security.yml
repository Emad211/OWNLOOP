name: Finalize OL-027 Codex security

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - name: Capture exact edit diagnostics
        shell: bash
        run: |
          set +e
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "PARENT=$(git rev-parse HEAD^)"
            echo "PATCH_BLOB=$(git hash-object .ol027-transfer/codex-dedup.patch)"
            git apply --check .ol027-transfer/codex-dedup.patch
            echo "PATCH_CHECK=$?"
            python - <<'PY'
          from pathlib import Path

          contract = Path("packages/contracts/src/codex-ingress-security.ts").read_text(encoding="utf-8")
          path_text = Path("packages/ingress-security/src/path-reduction.ts").read_text(encoding="utf-8")
          test_text = Path("packages/ingress-security/tests/codex-prepare.test.ts").read_text(encoding="utf-8")
          fixture_text = Path("packages/ingress-security/tests/codex-fixtures.ts").read_text(encoding="utf-8")

          markers = {
              "control_constant": (contract, 'const controlPattern = /[\\u0000-\\u001f\\u007f]/u;\n'),
              "control_refinement": (contract, '.refine((value) => !controlPattern.test(value))'),
              "transcript_parameter": (path_text, '  transcriptPath: string,\n'),
              "transcript_iife": (path_text, '  const transcript = (() => {\n    try {\n'),
              "fixture_import": (test_text, 'import { validCodexHookFixtures } from "@ownloop/test-fixtures";\n'),
              "fixture_input": (test_text, '  input: (typeof validCodexHookFixtures)[number]["input"],\n'),
              "authorization_rule": (test_text, '        "string.authorization",\n'),
              "unknown_start": (test_text, '  it("strips unknown upstream wrapper and payload fields before persistence", () => {'),
              "unknown_end": (test_text, '  it("applies configured custom secret fields to arbitrary Codex tool data", () => {'),
              "turn_fields_marker": (fixture_text, '  permission_mode: "default",\n};\n\nexport const validCodexHookFixtures'),
          }
          for name, (text, marker) in markers.items():
              print(f"{name}={text.count(marker)}")
          PY
          } > /tmp/ol027-codex-edit-diagnostics.log 2>&1
          cat /tmp/ol027-codex-edit-diagnostics.log
          exit 0

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ol027-codex-edit-diagnostics
          path: /tmp/ol027-codex-edit-diagnostics.log
          if-no-files-found: error
          retention-days: 1
