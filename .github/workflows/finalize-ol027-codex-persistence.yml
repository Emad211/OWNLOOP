name: Finalize OL-027 Codex persistence

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Apply exact source-aware persistence edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3e1a05263de2000ee7df5f9e7e5d709f49db3ef4"
          python - <<'PY'
          from pathlib import Path

          repository = Path("apps/daemon/src/persistence/repositories/ingress-receipts.ts")
          text = repository.read_text(encoding="utf-8")

          old_import = '''import {
            type PreparedIngressReceiptV1,
            PreparedIngressReceiptV1Schema,
            type RedactionSummaryV1,
          } from "@ownloop/contracts";
          '''
          new_import = '''import {
            type RedactionSummaryV1,
            RedactionSummaryV1Schema,
          } from "@ownloop/contracts";
          '''
          if text.count(old_import) != 1:
              raise SystemExit("prepared receipt import precondition failed")
          text = text.replace(old_import, new_import)

          anchor = 'import { runInTransaction } from "../transaction.js";\n'
          local_import = '''import {
            parsePreparedAgentIngressReceipt,
            type PreparedAgentIngressReceiptV1,
          } from "../prepared-agent-ingress.js";
          '''
          if text.count(anchor) != 1 or local_import in text:
              raise SystemExit("local parser import precondition failed")
          text = text.replace(anchor, local_import + anchor)

          replacements = {
              '  PreparedIngressReceiptV1 &\n': '  PreparedAgentIngressReceiptV1 &\n',
              'export type NewPreparedIngressReceipt = OperationalReceiptFields & PreparedIngressReceiptV1;': 'export type NewPreparedIngressReceipt = OperationalReceiptFields & PreparedAgentIngressReceiptV1;',
              'function validatePreparedContract(receipt: NewPreparedIngressReceipt): PreparedIngressReceiptV1 {': 'function validatePreparedContract(\n  receipt: NewPreparedIngressReceipt,\n): PreparedAgentIngressReceiptV1 {',
              'const result = PreparedIngressReceiptV1Schema.shape.redactionSummary.safeParse(parsed);': 'const result = RedactionSummaryV1Schema.safeParse(parsed);',
              'const result = PreparedIngressReceiptV1Schema.safeParse({': 'const result = parsePreparedAgentIngressReceipt({',
              'const prepared = PreparedIngressReceiptV1Schema.safeParse({': 'const prepared = parsePreparedAgentIngressReceipt({',
              '  if (!result.success) {': '  if (result === null) {',
              '  return result.data;': '  return result;',
              '    if (!prepared.success) {': '    if (prepared === null) {',
              '    return { ...operational, ...prepared.data, preparationStatus: "prepared" };': '    return { ...operational, ...prepared, preparationStatus: "prepared" };',
          }
          expected_counts = {
              '  PreparedIngressReceiptV1 &\n': 1,
              'export type NewPreparedIngressReceipt = OperationalReceiptFields & PreparedIngressReceiptV1;': 1,
              'function validatePreparedContract(receipt: NewPreparedIngressReceipt): PreparedIngressReceiptV1 {': 1,
              'const result = PreparedIngressReceiptV1Schema.shape.redactionSummary.safeParse(parsed);': 1,
              'const result = PreparedIngressReceiptV1Schema.safeParse({': 1,
              'const prepared = PreparedIngressReceiptV1Schema.safeParse({': 1,
              '  if (!result.success) {': 2,
              '  return result.data;': 2,
              '    if (!prepared.success) {': 1,
              '    return { ...operational, ...prepared.data, preparationStatus: "prepared" };': 1,
          }

          # Summary parsing retains Zod's result object; only the two prepared-receipt
          # branches switch from safeParse result objects to nullable union values.
          if text.count('  if (!result.success) {') != 2 or text.count('  return result.data;') != 2:
              raise SystemExit("shared result branch counts changed unexpectedly")
          text = text.replace('  if (!result.success) {', '  if (result === null) {', 1)
          text = text.replace('  return result.data;', '  return result;', 1)

          for old in [
              '  PreparedIngressReceiptV1 &\n',
              'export type NewPreparedIngressReceipt = OperationalReceiptFields & PreparedIngressReceiptV1;',
              'function validatePreparedContract(receipt: NewPreparedIngressReceipt): PreparedIngressReceiptV1 {',
              'const result = PreparedIngressReceiptV1Schema.shape.redactionSummary.safeParse(parsed);',
              'const result = PreparedIngressReceiptV1Schema.safeParse({',
              'const prepared = PreparedIngressReceiptV1Schema.safeParse({',
              '    if (!prepared.success) {',
              '    return { ...operational, ...prepared.data, preparationStatus: "prepared" };',
          ]:
              expected = expected_counts[old]
              if text.count(old) != expected:
                  raise SystemExit(f"repository edit precondition failed for {old!r}: {text.count(old)}")
              text = text.replace(old, replacements[old])

          # validatePreparedContract is now the remaining prepared-receipt result branch.
          if text.count('  if (!result.success) {') != 1 or text.count('  return result.data;') != 1:
              raise SystemExit("validate prepared branch count changed unexpectedly")
          text = text.replace('  if (!result.success) {', '  if (result === null) {')
          text = text.replace('  return result.data;', '  return result;')

          repository.write_text(text, encoding="utf-8")

          test_file = Path("apps/daemon/src/persistence/codex-ingress-repository.test.ts")
          test_text = test_file.read_text(encoding="utf-8")
          old_count = '      expect(persistence.ingressReceipts.countAll()).toBe(1);\n'
          new_count = '      expect(persistence.ingressReceipts.get("receipt-codex-002")).toBeNull();\n'
          if test_text.count(old_count) != 2:
              raise SystemExit("Codex repository count assertion precondition failed")
          test_file.write_text(test_text.replace(old_count, new_count), encoding="utf-8")
          PY
          rm .github/workflows/finalize-ol027-codex-persistence.yml

      - run: pnpm install --frozen-lockfile

      - name: Format persistence source
        run: |
          pnpm exec biome check --write \
            apps/daemon/src/persistence/prepared-agent-ingress.ts \
            apps/daemon/src/persistence/prepared-agent-ingress.test.ts \
            apps/daemon/src/persistence/codex-ingress-repository.test.ts \
            apps/daemon/src/persistence/repositories/ingress-receipts.ts

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test source-aware receipt persistence
        run: pnpm vitest run apps/daemon/src/persistence/prepared-agent-ingress.test.ts apps/daemon/src/persistence/codex-ingress-repository.test.ts apps/daemon/src/persistence/repositories/ingress-receipts.test.ts

      - name: Test full repository
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish clean persistence head
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/finalize-ol027-codex-persistence.yml
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name 'Emad211'
          git config user.email '82148680+Emad211@users.noreply.github.com'
          git commit -m 'OL-027: Persist source-aware prepared receipts'
          git push origin "HEAD:${{ github.head_ref }}"
