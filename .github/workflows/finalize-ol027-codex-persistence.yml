name: Finalize OL-027 Codex persistence

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Apply exact source-aware persistence edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "67da90363c31ebbcf857b0767f49b6912e668b81"
          python - <<'PY'
          from pathlib import Path

          repository = Path("apps/daemon/src/persistence/repositories/ingress-receipts.ts")
          text = repository.read_text(encoding="utf-8")
          old_import = '''import {
            type PreparedIngressReceiptV1,
            PreparedIngressReceiptV1Schema,
            type RedactionSummaryV1,
          } from "@ownloop/contracts";
          '''
          new_import = '''import {
            type PreparedIngressReceiptV1,
            type RedactionSummaryV1,
            RedactionSummaryV1Schema,
          } from "@ownloop/contracts";
          import type { PreparedCodexIngressReceiptV1 } from "@ownloop/contracts/codex";
          '''
          if text.count(old_import) != 1:
              raise SystemExit("prepared receipt import precondition failed")
          text = text.replace(old_import, new_import)
          anchor = 'import { runInTransaction } from "../transaction.js";\n'
          local_import = '''import {
            parsePreparedAgentIngressReceipt,
            type PreparedAgentIngressReceiptV1,
          } from "../prepared-agent-ingress.js";
          '''
          if text.count(anchor) != 1:
              raise SystemExit("local parser import precondition failed")
          text = text.replace(anchor, local_import + anchor)
          old_types = '''export type PreparedIngressReceiptRecord = OperationalReceiptFields &
            PreparedIngressReceiptV1 &
            Readonly<{ preparationStatus: "prepared" }>;

          export type IngressReceipt = LegacyIngressReceipt | PreparedIngressReceiptRecord;

          export type NewPreparedIngressReceipt = OperationalReceiptFields & PreparedIngressReceiptV1;
          '''
          new_types = '''export type ClaudePreparedIngressReceiptRecord = OperationalReceiptFields &
            PreparedIngressReceiptV1 &
            Readonly<{ preparationStatus: "prepared" }>;

          export type CodexPreparedIngressReceiptRecord = OperationalReceiptFields &
            PreparedCodexIngressReceiptV1 &
            Readonly<{ preparationStatus: "prepared" }>;

          export type PreparedIngressReceiptRecord =
            | ClaudePreparedIngressReceiptRecord
            | CodexPreparedIngressReceiptRecord;

          export type IngressReceipt = LegacyIngressReceipt | PreparedIngressReceiptRecord;

          export type NewPreparedIngressReceipt = OperationalReceiptFields & PreparedIngressReceiptV1;
          export type NewCodexPreparedIngressReceipt =
            OperationalReceiptFields & PreparedCodexIngressReceiptV1;
          export type NewAgentPreparedIngressReceipt =
            | NewPreparedIngressReceipt
            | NewCodexPreparedIngressReceipt;
          '''
          if text.count(old_types) != 1:
              raise SystemExit("prepared receipt type block precondition failed")
          text = text.replace(old_types, new_types)
          summary_old = 'const result = PreparedIngressReceiptV1Schema.shape.redactionSummary.safeParse(parsed);'
          if text.count(summary_old) != 1:
              raise SystemExit("redaction summary parser precondition failed")
          text = text.replace(summary_old, 'const result = RedactionSummaryV1Schema.safeParse(parsed);')
          start = text.index('function validatePreparedContract(')
          end = text.index('\n\nexport class IngressReceiptRepository', start)
          validate = text[start:end]
          for old, new in {
              'function validatePreparedContract(receipt: NewPreparedIngressReceipt): PreparedIngressReceiptV1 {': 'function validatePreparedContract(\n  receipt: NewAgentPreparedIngressReceipt,\n): PreparedAgentIngressReceiptV1 {',
              'const result = PreparedIngressReceiptV1Schema.safeParse({': 'const result = parsePreparedAgentIngressReceipt({',
              '  if (!result.success) {': '  if (result === null) {',
              '  return result.data;': '  return result;',
          }.items():
              if validate.count(old) != 1:
                  raise SystemExit(f"validate edit precondition failed for {old!r}")
              validate = validate.replace(old, new)
          text = text[:start] + validate + text[end:]
          for old, new in {
              '  insertPrepared(receipt: NewPreparedIngressReceipt): void {': '  insertPrepared(receipt: NewAgentPreparedIngressReceipt): void {',
              '  insertPreparedOrGetExisting(receipt: NewPreparedIngressReceipt): PreparedIngressInsertResult {': '  insertPreparedOrGetExisting(\n    receipt: NewAgentPreparedIngressReceipt,\n  ): PreparedIngressInsertResult {',
              'const prepared = PreparedIngressReceiptV1Schema.safeParse({': 'const prepared = parsePreparedAgentIngressReceipt({',
              '    if (!prepared.success) {': '    if (prepared === null) {',
              '    return { ...operational, ...prepared.data, preparationStatus: "prepared" };': '    return { ...operational, ...prepared, preparationStatus: "prepared" };',
          }.items():
              if text.count(old) != 1:
                  raise SystemExit(f"repository union edit precondition failed for {old!r}")
              text = text.replace(old, new)
          repository.write_text(text, encoding="utf-8")

          index_file = Path("apps/daemon/src/persistence/index.ts")
          index_text = index_file.read_text(encoding="utf-8")
          old_exports = '''  IngressReceipt,
            IngressReceiptStatus,
            LegacyIngressReceipt,
            NewPreparedIngressReceipt,
            PreparedIngressInsertResult,
            PreparedIngressReceiptRecord,
          '''
          new_exports = '''  ClaudePreparedIngressReceiptRecord,
            CodexPreparedIngressReceiptRecord,
            IngressReceipt,
            IngressReceiptStatus,
            LegacyIngressReceipt,
            NewAgentPreparedIngressReceipt,
            NewCodexPreparedIngressReceipt,
            NewPreparedIngressReceipt,
            PreparedIngressInsertResult,
            PreparedIngressReceiptRecord,
          '''
          if index_text.count(old_exports) != 1:
              raise SystemExit("persistence ingress export precondition failed")
          index_file.write_text(index_text.replace(old_exports, new_exports), encoding="utf-8")

          test_file = Path("apps/daemon/src/persistence/codex-ingress-repository.test.ts")
          test_text = test_file.read_text(encoding="utf-8")
          old_count = '      expect(persistence.ingressReceipts.countAll()).toBe(1);\n'
          if test_text.count(old_count) != 2:
              raise SystemExit("count assertion precondition failed")
          test_file.write_text(
              test_text.replace(
                  old_count,
                  '      expect(persistence.ingressReceipts.get("receipt-codex-002")).toBeNull();\n',
              ),
              encoding="utf-8",
          )
          PY

      - run: pnpm install --frozen-lockfile

      - name: Format exact source
        run: |
          pnpm exec biome check --write \
            apps/daemon/src/persistence/prepared-agent-ingress.ts \
            apps/daemon/src/persistence/prepared-agent-ingress.test.ts \
            apps/daemon/src/persistence/codex-ingress-repository.test.ts \
            apps/daemon/src/persistence/repositories/ingress-receipts.ts \
            apps/daemon/src/persistence/index.ts

      - name: Capture focused test diagnostics
        shell: bash
        run: |
          set +e
          pnpm vitest run \
            apps/daemon/src/persistence/prepared-agent-ingress.test.ts \
            apps/daemon/src/persistence/codex-ingress-repository.test.ts \
            apps/daemon/src/persistence/prepared-ingress-receipts.test.ts \
            apps/daemon/src/persistence/repositories.test.ts \
            --reporter=verbose > /tmp/ol027-codex-persistence-tests.log 2>&1
          code=$?
          printf '%s\n' "$code" > /tmp/ol027-codex-persistence-tests.exit
          cat /tmp/ol027-codex-persistence-tests.log
          exit 0

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ol027-codex-persistence-tests
          path: |
            /tmp/ol027-codex-persistence-tests.log
            /tmp/ol027-codex-persistence-tests.exit
          if-no-files-found: error
          retention-days: 1
