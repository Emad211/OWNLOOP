name: Finalize OL-027 Codex persistence

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Apply exact source-aware persistence edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1f8b27479913438fbc0eb57a43a21d7688318d3f"
          python - <<'PY'
          from pathlib import Path

          repository = Path("apps/daemon/src/persistence/repositories/ingress-receipts.ts")
          text = repository.read_text(encoding="utf-8")

          old_import = '''import {
            type PreparedIngressReceiptV1,
            PreparedIngressReceiptV1Schema,
            type RedactionSummaryV1,
          } from "@ownloop/contracts";
          '''
          new_import = '''import {
            type RedactionSummaryV1,
            RedactionSummaryV1Schema,
          } from "@ownloop/contracts";
          '''
          if text.count(old_import) != 1:
              raise SystemExit("prepared receipt import precondition failed")
          text = text.replace(old_import, new_import)

          anchor = 'import { runInTransaction } from "../transaction.js";\n'
          local_import = '''import {
            parsePreparedAgentIngressReceipt,
            type PreparedAgentIngressReceiptV1,
          } from "../prepared-agent-ingress.js";
          '''
          if text.count(anchor) != 1 or local_import in text:
              raise SystemExit("local parser import precondition failed")
          text = text.replace(anchor, local_import + anchor)

          direct_replacements = {
              '  PreparedIngressReceiptV1 &\n': '  PreparedAgentIngressReceiptV1 &\n',
              'export type NewPreparedIngressReceipt = OperationalReceiptFields & PreparedIngressReceiptV1;': 'export type NewPreparedIngressReceipt = OperationalReceiptFields & PreparedAgentIngressReceiptV1;',
              'const result = PreparedIngressReceiptV1Schema.shape.redactionSummary.safeParse(parsed);': 'const result = RedactionSummaryV1Schema.safeParse(parsed);',
          }
          for old, new in direct_replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"direct persistence edit precondition failed for {old!r}")
              text = text.replace(old, new)

          validate_start_marker = 'function validatePreparedContract('
          validate_end_marker = '\n\nexport class IngressReceiptRepository'
          if text.count(validate_start_marker) != 1 or text.count(validate_end_marker) != 1:
              raise SystemExit("validatePreparedContract markers are not unique")
          validate_start = text.index(validate_start_marker)
          validate_end = text.index(validate_end_marker, validate_start)
          validate = text[validate_start:validate_end]
          validate_replacements = {
              'function validatePreparedContract(receipt: NewPreparedIngressReceipt): PreparedIngressReceiptV1 {': 'function validatePreparedContract(\n  receipt: NewPreparedIngressReceipt,\n): PreparedAgentIngressReceiptV1 {',
              'const result = PreparedIngressReceiptV1Schema.safeParse({': 'const result = parsePreparedAgentIngressReceipt({',
              '  if (!result.success) {': '  if (result === null) {',
              '  return result.data;': '  return result;',
          }
          for old, new in validate_replacements.items():
              if validate.count(old) != 1:
                  raise SystemExit(f"validate prepared edit precondition failed for {old!r}")
              validate = validate.replace(old, new)
          text = text[:validate_start] + validate + text[validate_end:]

          get_replacements = {
              'const prepared = PreparedIngressReceiptV1Schema.safeParse({': 'const prepared = parsePreparedAgentIngressReceipt({',
              '    if (!prepared.success) {': '    if (prepared === null) {',
              '    return { ...operational, ...prepared.data, preparationStatus: "prepared" };': '    return { ...operational, ...prepared, preparationStatus: "prepared" };',
          }
          for old, new in get_replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"persisted read edit precondition failed for {old!r}")
              text = text.replace(old, new)

          if "PreparedIngressReceiptV1Schema" in text or "PreparedIngressReceiptV1" in text:
              raise SystemExit("Claude-only prepared receipt references remain")
          repository.write_text(text, encoding="utf-8")

          test_file = Path("apps/daemon/src/persistence/codex-ingress-repository.test.ts")
          test_text = test_file.read_text(encoding="utf-8")
          old_count = '      expect(persistence.ingressReceipts.countAll()).toBe(1);\n'
          new_count = '      expect(persistence.ingressReceipts.get("receipt-codex-002")).toBeNull();\n'
          if test_text.count(old_count) != 2:
              raise SystemExit("Codex repository count assertion precondition failed")
          test_file.write_text(test_text.replace(old_count, new_count), encoding="utf-8")
          PY
          rm .github/workflows/finalize-ol027-codex-persistence.yml

      - run: pnpm install --frozen-lockfile

      - name: Format persistence source
        run: |
          pnpm exec biome check --write \
            apps/daemon/src/persistence/prepared-agent-ingress.ts \
            apps/daemon/src/persistence/prepared-agent-ingress.test.ts \
            apps/daemon/src/persistence/codex-ingress-repository.test.ts \
            apps/daemon/src/persistence/repositories/ingress-receipts.ts

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test source-aware receipt persistence
        run: pnpm vitest run apps/daemon/src/persistence/prepared-agent-ingress.test.ts apps/daemon/src/persistence/codex-ingress-repository.test.ts

      - name: Test full repository
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish clean persistence head
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/finalize-ol027-codex-persistence.yml
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name 'Emad211'
          git config user.email '82148680+Emad211@users.noreply.github.com'
          git commit -m 'OL-027: Persist source-aware prepared receipts'
          git push origin "HEAD:${{ github.head_ref }}"
