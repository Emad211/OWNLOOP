name: Finalize OL-023 Local Settings

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: finalize-ol023-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/ol-023-local-settings-privacy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify exact head and transfer chunks
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo '4433f2bf80721e1c5bece31a6338f2e7ad18fdd7bdd7af5886fd3f216cc0f825  .github/ol023-transfer/part-00' | sha256sum -c -
          echo 'c5dd6f5051edb80e948aa6e9ab40512bac9b21b0d0dfe1c6dc676a072db28aec  .github/ol023-transfer/part-01' | sha256sum -c -
          echo 'ff9a34b0ad8c37a0bc3bff78de96d17310670ddaa141cd989b3aa528c6d2461f  .github/ol023-transfer/part-02' | sha256sum -c -
          echo '8cb63256beded471507fc81dd3eee9dbf20bd87da0a42f21968e890cb2120442  .github/ol023-transfer/part-03' | sha256sum -c -
          echo '5e5e246ebd3e95e3b48f0394bba56afebbd9cefb0296c51f2225c4371fa59b03  .github/ol023-transfer/part-04' | sha256sum -c -
          echo 'becdbaf777902148fe419b7f9db2e2407a2ae9b6f4e742df7589579040caee15  .github/ol023-transfer/part-05' | sha256sum -c -
          echo 'e48353c1f3122f4ef6a0d55c7ec6b83b4e714c8a1d5f7fe3b2e06b51d81ef8cf  .github/ol023-transfer/part-06' | sha256sum -c -
          echo 'aba9e6373fc3a43a496f5afb86769a160089dbae2b21894fbe673f519a02b086  .github/ol023-transfer/part-07' | sha256sum -c -
          echo 'd07efab691647a898973d5bf31ff9f3c335d26308c02bfdc42f03694ef93ead2  .github/ol023-transfer/part-08' | sha256sum -c -
          echo '19873eabc06095de33d7fa6bb47c36525f21eb0b4e1421c6d2e658d8bb8c0a09  .github/ol023-transfer/part-09' | sha256sum -c -
          echo '2d687b9e0aadc3136139a56de7395432755555e427fe273c1f924f81d4c2b8bb  .github/ol023-transfer/part-10' | sha256sum -c -
          echo 'bd3b21c368454e622507b9978e01871a6ac240aa35d8c727e96011818e315eb3  .github/ol023-transfer/part-11' | sha256sum -c -
          echo 'eb80b5096b7397a85b70380b6be7d594150e552d446a0b82575ceec2333e1cf4  .github/ol023-transfer/part-12' | sha256sum -c -

      - name: Reconstruct and apply exact OL-023 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ol023-transfer/part-* > /tmp/ol023.patch.gz.b64
          test "$(wc -c < /tmp/ol023.patch.gz.b64)" = '50356'
          echo '801985c7caca2a161fd0fdeb4650076a6ac84bbb7518d3ed475dd3788fc350b6  /tmp/ol023.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/ol023.patch.gz.b64 > /tmp/ol023.patch.gz
          test "$(wc -c < /tmp/ol023.patch.gz)" = '37767'
          echo '58ebf202167d4ea0958ad845a89c5f854c73bc4912dd67919db28a00972b2b21  /tmp/ol023.patch.gz' | sha256sum -c -
          gzip --decompress --stdout /tmp/ol023.patch.gz > /tmp/ol023.patch
          test "$(wc -c < /tmp/ol023.patch)" = '175696'
          echo '13ce9b5ccae7b48edb131de3c63bdac112a013da23422e0e157c0457dc1fce73  /tmp/ol023.patch' | sha256sum -c -
          git apply --check /tmp/ol023.patch
          git apply /tmp/ol023.patch
          rm -rf .github/ol023-transfer
          rm -f .github/workflows/finalize-ol023.yml
          rm -f .github/workflows/export-ol023-toolchain.yml
          git diff --check

      - name: Set up exact Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up exact pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit and verify exact final scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'OL-023: Implement local settings and privacy controls'
          git fetch origin main --depth=1
          git diff --check origin/main HEAD
          git diff --name-only origin/main HEAD | LC_ALL=C sort > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          AGENTS.md
          README.md
          apps/daemon/src/index.ts
          apps/daemon/src/ingress/server.ts
          apps/daemon/src/local-settings/README.md
          apps/daemon/src/local-settings/diagnostics.ts
          apps/daemon/src/local-settings/errors.ts
          apps/daemon/src/local-settings/index.ts
          apps/daemon/src/local-settings/routes.integration.test.ts
          apps/daemon/src/local-settings/routes.ts
          apps/daemon/src/local-settings/service.test.ts
          apps/daemon/src/local-settings/service.ts
          apps/daemon/src/persistence/index.ts
          apps/daemon/src/persistence/migration-definitions.ts
          apps/daemon/src/persistence/migrations.test.ts
          apps/daemon/src/persistence/repositories/local-settings.test.ts
          apps/daemon/src/persistence/repositories/local-settings.ts
          apps/daemon/src/persistence/repositories/task-runs.ts
          apps/web/src/App.test.tsx
          apps/web/src/App.tsx
          apps/web/src/Settings.test.tsx
          apps/web/src/Settings.tsx
          apps/web/src/api.test.ts
          apps/web/src/api.ts
          apps/web/src/styles.css
          docs/adr/0025-local-settings-and-privacy-controls.md
          docs/architecture/C4.md
          packages/contracts/src/index.ts
          packages/contracts/src/ingress-security.ts
          packages/contracts/src/local-settings.ts
          packages/contracts/tests/local-settings.test.ts
          packages/ingress-security/src/constants.ts
          packages/ingress-security/src/custom-secret-fields.test.ts
          packages/ingress-security/src/index.ts
          packages/ingress-security/src/prepare.ts
          packages/ingress-security/src/redaction.ts
          EOF
          sed -i 's/^          //' /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(wc -l < /tmp/actual-files)" = '36'
          test ! -e .github/ol023-transfer
          test ! -e .github/workflows/finalize-ol023.yml
          test ! -e .github/workflows/export-ol023-toolchain.yml
          test -z "$(git status --porcelain)"

      - name: Publish exact verified head
        shell: bash
        run: git push origin HEAD:${{ github.head_ref }}
