name: Diagnose OL-025 package build

on:
  pull_request:
    branches:
      - agent/ol025-package-diagnosis-base

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false
      - name: Reconstruct exact OL-025 source and apply package fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .ol025-diagnosis/package-fix.patch | cut -d' ' -f1)" = "099b2ab8d29276c0fbace90668a0b379cb7d28f03e6e1bfe5376c3096bc9e60b"
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          b64=b''.join((Path('.ol025-transfer')/f'chunk-{i:02d}.txt').read_bytes() for i in range(13))
          gz=base64.b64decode(b64, validate=True)
          patch=gzip.decompress(gz)
          if len(patch)!=307654 or hashlib.sha256(patch).hexdigest()!='81e01d5427b5dc75b1fab53d00824521b77aafcf9be4b90397dc388cd02d7fc9':
              raise SystemExit('patch mismatch')
          Path('/tmp/ol025.patch').write_bytes(patch)
          PY
          git apply --check /tmp/ol025.patch
          git apply /tmp/ol025.patch
          git apply --check .ol025-diagnosis/package-fix.patch
          git apply .ol025-diagnosis/package-fix.patch
          rm -rf .ol025-transfer .ol025-diagnosis .github/workflows/finalize-ol025.yml .github/workflows/diagnose-ol025-package.yml
      - run: pnpm install --frozen-lockfile
      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          pnpm format:check
          pnpm lint
          pnpm --filter @ownloop/local-installer typecheck
          pnpm vitest run tools/local-installer/tests/package-builder.test.ts
      - name: Build two independent verified packages
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          rm -rf /tmp/ol025-package-a /tmp/ol025-package-b
          pnpm package:windows /tmp/ol025-package-a | tee /tmp/package-a.json
          pnpm package:windows /tmp/ol025-package-b | tee /tmp/package-b.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/package-a.json').read_text())
          b=json.loads(Path('/tmp/package-b.json').read_text())
          if a.get('ok') is not True or b.get('ok') is not True:
              raise SystemExit('package build failed')
          if a.get('fingerprint') != b.get('fingerprint'):
              raise SystemExit('package fingerprints differ')
          if a.get('fileCount') != b.get('fileCount'):
              raise SystemExit('package file counts differ')
          Path('/tmp/package-summary.json').write_text(json.dumps({
              'fingerprint': a['fingerprint'],
              'fileCount': a['fileCount'],
          }, sort_keys=True)+'\n')
          PY
          PACKAGE_A=/tmp/ol025-package-a/ownloop-windows-0.1.0
          PACKAGE_B=/tmp/ol025-package-b/ownloop-windows-0.1.0
          test "$(find "$PACKAGE_A" -type l | wc -l | tr -d ' ')" = "0"
          test "$(find "$PACKAGE_B" -type l | wc -l | tr -d ' ')" = "0"
          test ! -e "$PACKAGE_A/daemon/node_modules/.bin"
          test ! -e "$PACKAGE_A/hook-adapter/node_modules/.bin"
          test ! -e "$PACKAGE_A/installer/node_modules/.bin"
          node -e "import('/tmp/ol025-package-a/ownloop-windows-0.1.0/daemon/dist/runtime/compatibility.js').then(()=>console.log('daemon-import-ok'))"
          node -e "import('/tmp/ol025-package-a/ownloop-windows-0.1.0/hook-adapter/dist/adapter.js').then(()=>console.log('hook-import-ok'))"
          node -e "import('/tmp/ol025-package-a/ownloop-windows-0.1.0/installer/dist/package-builder.js').then(()=>console.log('installer-import-ok'))"
          du -sb "$PACKAGE_A" > /tmp/package-size.txt
          find "$PACKAGE_A" -mindepth 1 -printf '%P\n' | LC_ALL=C sort > /tmp/package-files.txt
          tar -czf /tmp/ol025-package-a.tar.gz -C /tmp/ol025-package-a ownloop-windows-0.1.0
      - uses: actions/upload-artifact@v6
        with:
          name: ol025-fixed-package-proof
          path: |
            /tmp/package-a.json
            /tmp/package-b.json
            /tmp/package-summary.json
            /tmp/package-size.txt
            /tmp/package-files.txt
            /tmp/ol025-package-a.tar.gz
          if-no-files-found: error
          retention-days: 1
