name: Diagnose OL-025 package build

on:
  pull_request:
    branches:
      - agent/ol025-package-diagnosis-base

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false
      - name: Reconstruct exact OL-025 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          b64=b''.join((Path('.ol025-transfer')/f'chunk-{i:02d}.txt').read_bytes() for i in range(13))
          gz=base64.b64decode(b64, validate=True)
          patch=gzip.decompress(gz)
          if len(patch)!=307654 or hashlib.sha256(patch).hexdigest()!='81e01d5427b5dc75b1fab53d00824521b77aafcf9be4b90397dc388cd02d7fc9':
              raise SystemExit('patch mismatch')
          Path('/tmp/ol025.patch').write_bytes(patch)
          PY
          git apply --check /tmp/ol025.patch
          git apply /tmp/ol025.patch
          rm -rf .ol025-transfer .github/workflows/finalize-ol025.yml .github/workflows/diagnose-ol025-package.yml
      - run: pnpm install --frozen-lockfile
      - name: Test hoisted deploy layout
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          rm -rf /tmp/ol025-hoisted
          mkdir -p /tmp/ol025-hoisted
          pnpm --config.node-linker=hoisted --filter @ownloop/daemon deploy --prod --offline --legacy /tmp/ol025-hoisted/daemon
          pnpm --config.node-linker=hoisted --filter @ownloop/hook-adapter deploy --prod --offline --legacy /tmp/ol025-hoisted/hook-adapter
          pnpm --config.node-linker=hoisted --filter @ownloop/local-installer deploy --prod --offline --legacy /tmp/ol025-hoisted/installer
          find /tmp/ol025-hoisted -type l -printf '%P -> %l\n' | LC_ALL=C sort > /tmp/hoisted-symlinks.txt
          find /tmp/ol025-hoisted -mindepth 1 -printf '%P\n' | LC_ALL=C sort > /tmp/hoisted-files.txt
          du -sb /tmp/ol025-hoisted > /tmp/hoisted-size.txt
          node -e "import('/tmp/ol025-hoisted/daemon/dist/runtime/compatibility.js').then(()=>console.log('daemon-import-ok'))"
          node -e "import('/tmp/ol025-hoisted/hook-adapter/dist/adapter.js').then(()=>console.log('hook-import-ok'))"
          node -e "import('/tmp/ol025-hoisted/installer/dist/package-builder.js').then(()=>console.log('installer-import-ok'))"
          tar -czf /tmp/ol025-hoisted.tar.gz -C /tmp ol025-hoisted
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ol025-hoisted-deploy-diagnosis
          path: |
            /tmp/hoisted-symlinks.txt
            /tmp/hoisted-files.txt
            /tmp/hoisted-size.txt
            /tmp/ol025-hoisted.tar.gz
          if-no-files-found: error
          retention-days: 1
