name: Diagnose OL-025 package build

on:
  pull_request:
    branches:
      - agent/ol025-package-diagnosis-base

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false
      - name: Reconstruct exact OL-025 source and apply package fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .ol025-diagnosis/package-fix.patch | cut -d' ' -f1)" = "099b2ab8d29276c0fbace90668a0b379cb7d28f03e6e1bfe5376c3096bc9e60b"
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          b64=b''.join((Path('.ol025-transfer')/f'chunk-{i:02d}.txt').read_bytes() for i in range(13))
          gz=base64.b64decode(b64, validate=True)
          patch=gzip.decompress(gz)
          if len(patch)!=307654 or hashlib.sha256(patch).hexdigest()!='81e01d5427b5dc75b1fab53d00824521b77aafcf9be4b90397dc388cd02d7fc9':
              raise SystemExit('patch mismatch')
          Path('/tmp/ol025.patch').write_bytes(patch)
          PY
          git apply --check /tmp/ol025.patch
          git apply /tmp/ol025.patch
          git apply --check .ol025-diagnosis/package-fix.patch
          git apply .ol025-diagnosis/package-fix.patch
          rm -rf .ol025-transfer .ol025-diagnosis .github/workflows/finalize-ol025.yml .github/workflows/diagnose-ol025-package.yml
      - run: pnpm install --frozen-lockfile
      - name: Reveal original post-deploy failure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('tools/local-installer/src/package-builder.ts')
          text=path.read_text()
          old='''    if (error instanceof PackageBuilderError) throw error;\n    throw new PackageBuilderError("build_failed");'''
          if old not in text:
              raise SystemExit('diagnostic catch boundary not found')
          path.write_text(text.replace(old, '    throw error;', 1))
          PY
          pnpm build
          cat > /tmp/debug-package.mjs <<'JS'
          import { execFile } from 'node:child_process';
          import { appendFile, rm } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          import { promisify } from 'node:util';
          const moduleUrl=pathToFileURL(resolve('tools/local-installer/dist/package-builder.js')).href;
          const { buildWindowsReleasePackage }=await import(moduleUrl);
          const execFileAsync=promisify(execFile);
          const log='/tmp/package-debug.log';
          await rm(log,{force:true});
          const runner=async(executable,args,options)=>{
            await appendFile(log,`START ${JSON.stringify({executable,args,cwd:options.cwd})}\n`);
            try {
              const result=await execFileAsync(executable,[...args],{cwd:options.cwd,windowsHide:true,timeout:10*60_000,maxBuffer:16*1024*1024});
              await appendFile(log,`OK ${JSON.stringify({stdout:result.stdout,stderr:result.stderr})}\n`);
              return {stdout:result.stdout,stderr:result.stderr};
            } catch(error) {
              await appendFile(log,`FAIL ${JSON.stringify({name:error?.name,message:error?.message,code:error?.code,stdout:error?.stdout,stderr:error?.stderr,stack:error?.stack})}\n`);
              throw error;
            }
          };
          try {
            const result=await buildWindowsReleasePackage({repositoryRoot:resolve('.'),outputRoot:'/tmp/ol025-debug-output',runner,nodeVersion:'24.18.0'});
            await appendFile(log,`RESULT ${JSON.stringify(result)}\n`);
          } catch(error) {
            await appendFile(log,`THROWN ${JSON.stringify({name:error?.name,message:error?.message,code:error?.code,errno:error?.errno,path:error?.path,syscall:error?.syscall,stack:error?.stack})}\n`);
          }
          JS
          node /tmp/debug-package.mjs
          cat /tmp/package-debug.log
          : > /tmp/package-debug-files.txt
          if test -d /tmp/ol025-debug-output; then
            find /tmp/ol025-debug-output -mindepth 1 -printf '%P\n' | LC_ALL=C sort > /tmp/package-debug-files.txt
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ol025-package-post-deploy-debug
          path: |
            /tmp/package-debug.log
            /tmp/package-debug-files.txt
          if-no-files-found: error
          retention-days: 1
