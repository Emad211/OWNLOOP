name: Diagnose OL-025 package build

on:
  pull_request:
    branches:
      - agent/ol025-package-diagnosis-base

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false
      - name: Reconstruct exact OL-025 source and apply package fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .ol025-diagnosis/package-fix.patch | cut -d' ' -f1)" = "099b2ab8d29276c0fbace90668a0b379cb7d28f03e6e1bfe5376c3096bc9e60b"
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          b64=b''.join((Path('.ol025-transfer')/f'chunk-{i:02d}.txt').read_bytes() for i in range(13))
          gz=base64.b64decode(b64, validate=True)
          patch=gzip.decompress(gz)
          if len(patch)!=307654 or hashlib.sha256(patch).hexdigest()!='81e01d5427b5dc75b1fab53d00824521b77aafcf9be4b90397dc388cd02d7fc9':
              raise SystemExit('patch mismatch')
          Path('/tmp/ol025.patch').write_bytes(patch)
          PY
          git apply --check /tmp/ol025.patch
          git apply /tmp/ol025.patch
          git apply --check .ol025-diagnosis/package-fix.patch
          git apply .ol025-diagnosis/package-fix.patch
          rm -rf .ol025-transfer .ol025-diagnosis .github/workflows/finalize-ol025.yml .github/workflows/diagnose-ol025-package.yml
      - run: pnpm install --frozen-lockfile
      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          pnpm format:check
          pnpm lint
          pnpm --filter @ownloop/local-installer typecheck
          pnpm vitest run tools/local-installer/tests/package-builder.test.ts
      - name: Capture two independent package builds
        shell: bash
        run: |
          set +e
          pnpm build > /tmp/build.stdout 2> /tmp/build.stderr
          printf '%s\n' "$?" > /tmp/build.exit
          rm -rf /tmp/ol025-package-a /tmp/ol025-package-b
          pnpm package:windows /tmp/ol025-package-a > /tmp/package-a.stdout 2> /tmp/package-a.stderr
          printf '%s\n' "$?" > /tmp/package-a.exit
          pnpm package:windows /tmp/ol025-package-b > /tmp/package-b.stdout 2> /tmp/package-b.stderr
          printf '%s\n' "$?" > /tmp/package-b.exit
          python - <<'PY'
          import json
          from pathlib import Path
          result={}
          for name in ('a','b'):
              stdout=Path(f'/tmp/package-{name}.stdout').read_text()
              parsed=None
              for line in reversed([line for line in stdout.splitlines() if line.strip()]):
                  try:
                      candidate=json.loads(line)
                  except Exception:
                      continue
                  if isinstance(candidate, dict):
                      parsed=candidate
                      break
              result[name]=parsed
          a=result['a'] or {}
          b=result['b'] or {}
          result['sameFingerprint']=bool(a.get('fingerprint')) and a.get('fingerprint') == b.get('fingerprint')
          result['sameFileCount']=a.get('fileCount') == b.get('fileCount')
          for name in ('a','b'):
              root=Path(f'/tmp/ol025-package-{name}/ownloop-windows-0.1.0')
              result[f'{name}Exists']=root.is_dir()
              result[f'{name}Symlinks']=sum(1 for path in root.rglob('*') if path.is_symlink()) if root.is_dir() else None
          Path('/tmp/package-diagnosis.json').write_text(json.dumps(result, sort_keys=True, indent=2)+'\n')
          PY
          for name in a b; do
            root="/tmp/ol025-package-${name}/ownloop-windows-0.1.0"
            if test -d "$root"; then
              find "$root" -mindepth 1 -printf '%P\n' | LC_ALL=C sort > "/tmp/package-${name}.files"
              du -sb "$root" > "/tmp/package-${name}.size"
              tar -czf "/tmp/ol025-package-${name}.tar.gz" -C "/tmp/ol025-package-${name}" ownloop-windows-0.1.0
            fi
          done
          cat /tmp/package-diagnosis.json
          tail -n 100 /tmp/package-a.stdout
          tail -n 100 /tmp/package-a.stderr
          exit 0
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ol025-fixed-package-diagnosis-v2
          path: |
            /tmp/build.stdout
            /tmp/build.stderr
            /tmp/build.exit
            /tmp/package-a.stdout
            /tmp/package-a.stderr
            /tmp/package-a.exit
            /tmp/package-b.stdout
            /tmp/package-b.stderr
            /tmp/package-b.exit
            /tmp/package-diagnosis.json
            /tmp/package-a.files
            /tmp/package-b.files
            /tmp/package-a.size
            /tmp/package-b.size
            /tmp/ol025-package-a.tar.gz
            /tmp/ol025-package-b.tar.gz
          if-no-files-found: warn
          retention-days: 1
