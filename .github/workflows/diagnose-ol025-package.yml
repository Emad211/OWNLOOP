name: Diagnose OL-025 package build

on:
  pull_request:
    branches:
      - agent/ol025-package-diagnosis-base

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false
      - name: Reconstruct exact OL-025 source and validated package-fix chain
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          original_b64 = b''.join(
              (Path('.ol025-transfer') / f'chunk-{index:02d}.txt').read_bytes()
              for index in range(13)
          )
          original = gzip.decompress(base64.b64decode(original_b64, validate=True))
          if len(original) != 307654 or hashlib.sha256(original).hexdigest() != '81e01d5427b5dc75b1fab53d00824521b77aafcf9be4b90397dc388cd02d7fc9':
              raise SystemExit('original patch mismatch')

          v3 = Path('.ol025-diagnosis/package-fix-v3.patch').read_bytes()
          if len(v3) != 13943 or hashlib.sha256(v3).hexdigest() != 'bb38d254c04714bbe8ab4f160c98966013108d2fedf61fce6c63e84e9a01f2bd':
              raise SystemExit('v3 patch mismatch')

          delta_paths = sorted(Path('.ol025-diagnosis/v3v4-chunks').glob('chunk-*.txt'))
          if [path.name for path in delta_paths] != [f'chunk-{index:02d}.txt' for index in range(4)]:
              raise SystemExit('v3-to-v4 chunk set mismatch')
          delta_payload = b''.join(path.read_bytes() for path in delta_paths)
          delta = base64.b64decode(delta_payload, validate=True)
          if len(delta) != 10854 or hashlib.sha256(delta).hexdigest() != '31f73de5c0d6f78552ab66d10e65b83e621c9ae64a95d14337f47e3735456923':
              raise SystemExit('v3-to-v4 patch mismatch')

          Path('/tmp/ol025.patch').write_bytes(original)
          Path('/tmp/ol025-v3.patch').write_bytes(v3)
          Path('/tmp/ol025-v3-v4.patch').write_bytes(delta)
          PY

          git apply --check /tmp/ol025.patch
          git apply /tmp/ol025.patch
          git add -A
          git -c user.name=diagnostic -c user.email=diagnostic@example.invalid commit -m 'temporary reconstructed OL-025 source'

          git apply --recount --check /tmp/ol025-v3.patch
          git apply --recount /tmp/ol025-v3.patch
          git apply --recount --check /tmp/ol025-v3-v4.patch
          git apply --recount /tmp/ol025-v3-v4.patch
          git diff --check
          git diff --binary --full-index > /tmp/ol025-package-fix-canonical.patch
          test "$(wc -c < /tmp/ol025-package-fix-canonical.patch)" -eq 23413
          test "$(sha256sum /tmp/ol025-package-fix-canonical.patch | cut -d' ' -f1)" = 'fa1af2a6200d26dde9dee42b507c2aca828a6acf5acf0ea7908b707c2baf1c29'

          rm -rf \
            .ol025-transfer \
            .ol025-diagnosis \
            .github/workflows/finalize-ol025.yml \
            .github/workflows/diagnose-ol025-package.yml \
            .github/workflows/diagnose-ol025-v4-checksums.yml
          rm -f diagnose-package-trigger.txt
          git diff --check
      - run: pnpm install --frozen-lockfile
      - name: Validate final package fix
        shell: bash
        run: |
          set -euo pipefail
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm vitest run packages/contracts/tests/local-installation.test.ts tools/local-installer/tests/*.test.ts
          pnpm build
      - name: Build and prove two independent packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ol025-package-a /tmp/ol025-package-b
          pnpm package:windows /tmp/ol025-package-a > /tmp/package-a.stdout 2> /tmp/package-a.stderr
          pnpm package:windows /tmp/ol025-package-b > /tmp/package-b.stdout 2> /tmp/package-b.stderr
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def load(name):
              lines = [
                  line
                  for line in Path(f'/tmp/package-{name}.stdout').read_text().splitlines()
                  if line.strip()
              ]
              if len(lines) != 1:
                  raise SystemExit(f'invalid package output {name}: {lines}')
              value = json.loads(lines[0])
              if value.get('ok') is not True:
                  raise SystemExit(f'package {name} failed: {value}')
              return value

          a = load('a')
          b = load('b')
          if a['fingerprint'] != b['fingerprint'] or a['fileCount'] != b['fileCount']:
              raise SystemExit('package outputs are not deterministic')

          metadata = [
              'daemon/pnpm-lock.yaml',
              'hook-adapter/pnpm-lock.yaml',
              'installer/pnpm-lock.yaml',
              'daemon/node_modules/.bin',
              'hook-adapter/node_modules/.bin',
              'installer/node_modules/.bin',
              'daemon/node_modules/.modules.yaml',
              'hook-adapter/node_modules/.modules.yaml',
              'installer/node_modules/.modules.yaml',
              'daemon/node_modules/.pnpm-workspace-state-v1.json',
              'hook-adapter/node_modules/.pnpm-workspace-state-v1.json',
              'installer/node_modules/.pnpm-workspace-state-v1.json',
              'daemon/node_modules/.pnpm',
              'hook-adapter/node_modules/.pnpm',
              'installer/node_modules/.pnpm',
          ]
          markers = [
              os.environ['GITHUB_WORKSPACE'].encode(),
              b'/home/runner/setup-pnpm',
              b'file:///home/runner',
          ]
          result = {'fingerprint': a['fingerprint'], 'fileCount': a['fileCount'], 'packages': {}}
          for name in ('a', 'b'):
              root = Path(f'/tmp/ol025-package-{name}/ownloop-windows-0.1.0')
              if not root.is_dir():
                  raise SystemExit(f'missing package root {name}')
              links = [str(path.relative_to(root)) for path in root.rglob('*') if path.is_symlink()]
              leftovers = [relative for relative in metadata if (root / relative).exists()]
              leaks = []
              for path in root.rglob('*'):
                  if path.is_file() and any(marker in path.read_bytes() for marker in markers):
                      leaks.append(str(path.relative_to(root)))
              if links or leftovers or leaks:
                  raise SystemExit(
                      f'package hygiene failure {name}: '
                      f'links={links[:5]} metadata={leftovers} leaks={leaks}'
                  )
              manifests = {}
              for label, relative in {
                  'daemon': 'daemon/package.json',
                  'hook': 'hook-adapter/package.json',
                  'installer': 'installer/package.json',
              }.items():
                  value = json.loads((root / relative).read_text())
                  if 'scripts' in value or 'devDependencies' in value:
                      raise SystemExit(f'non-runtime metadata remains: {name}/{relative}')
                  manifests[label] = value
              imports = {}
              for label, relative in {
                  'daemon': 'daemon/dist/runtime/compatibility.js',
                  'hook': 'hook-adapter/dist/adapter.js',
                  'installer': 'installer/dist/package-builder.js',
              }.items():
                  completed = subprocess.run(
                      ['node', '-e', f'import({json.dumps((root / relative).as_uri())})'],
                      capture_output=True,
                      text=True,
                  )
                  if completed.returncode != 0:
                      raise SystemExit(f'import failed {name}/{label}: {completed.stderr}')
                  imports[label] = 0
              result['packages'][name] = {
                  'symlinks': 0,
                  'metadata': 0,
                  'leaks': 0,
                  'imports': imports,
                  'manifests': manifests,
              }
          Path('/tmp/package-proof-result.json').write_text(
              json.dumps(result, sort_keys=True, indent=2) + '\n'
          )
          PY
          for name in a b; do
            root="/tmp/ol025-package-${name}/ownloop-windows-0.1.0"
            find "$root" -mindepth 1 -printf '%P\n' | LC_ALL=C sort > "/tmp/package-${name}.files"
            du -sb "$root" > "/tmp/package-${name}.size"
          done
          cat /tmp/package-proof-result.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ol025-final-package-proof-v3-v4-chain
          path: |
            /tmp/package-a.stdout
            /tmp/package-a.stderr
            /tmp/package-b.stdout
            /tmp/package-b.stderr
            /tmp/package-proof-result.json
            /tmp/package-a.files
            /tmp/package-b.files
            /tmp/package-a.size
            /tmp/package-b.size
            /tmp/ol025-package-fix-canonical.patch
          if-no-files-found: warn
          retention-days: 1
