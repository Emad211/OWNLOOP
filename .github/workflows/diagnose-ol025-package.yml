name: Diagnose OL-025 package build

on:
  pull_request:
    branches:
      - agent/ol025-package-diagnosis-base

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false
      - name: Reconstruct exact OL-025 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          b64=b''.join((Path('.ol025-transfer')/f'chunk-{i:02d}.txt').read_bytes() for i in range(13))
          gz=base64.b64decode(b64, validate=True)
          patch=gzip.decompress(gz)
          if len(patch)!=307654 or hashlib.sha256(patch).hexdigest()!='81e01d5427b5dc75b1fab53d00824521b77aafcf9be4b90397dc388cd02d7fc9':
              raise SystemExit('patch mismatch')
          Path('/tmp/ol025.patch').write_bytes(patch)
          PY
          git apply --check /tmp/ol025.patch
          git apply /tmp/ol025.patch
          rm -rf .ol025-transfer .github/workflows/finalize-ol025.yml .github/workflows/diagnose-ol025-package.yml
      - run: pnpm install --frozen-lockfile
      - name: Capture modern hoisted deploy behavior
        shell: bash
        run: |
          set +e
          : > /tmp/modern.log
          : > /tmp/modern-status.txt
          pnpm build >> /tmp/modern.log 2>&1
          printf 'build=%s\n' "$?" >> /tmp/modern-status.txt
          rm -rf /tmp/ol025-modern
          mkdir -p /tmp/ol025-modern
          pnpm --config.node-linker=hoisted --config.inject-workspace-packages=true --filter @ownloop/daemon deploy --prod --offline /tmp/ol025-modern/daemon >> /tmp/modern.log 2>&1
          printf 'daemon_deploy=%s\n' "$?" >> /tmp/modern-status.txt
          pnpm --config.node-linker=hoisted --config.inject-workspace-packages=true --filter @ownloop/hook-adapter deploy --prod --offline /tmp/ol025-modern/hook-adapter >> /tmp/modern.log 2>&1
          printf 'hook_deploy=%s\n' "$?" >> /tmp/modern-status.txt
          pnpm --config.node-linker=hoisted --config.inject-workspace-packages=true --filter @ownloop/local-installer deploy --prod --offline /tmp/ol025-modern/installer >> /tmp/modern.log 2>&1
          printf 'installer_deploy=%s\n' "$?" >> /tmp/modern-status.txt
          find /tmp/ol025-modern -type l -printf '%P -> %l\n' | LC_ALL=C sort > /tmp/modern-symlinks.txt 2>> /tmp/modern.log
          find /tmp/ol025-modern -mindepth 1 -printf '%P\n' | LC_ALL=C sort > /tmp/modern-files.txt 2>> /tmp/modern.log
          du -sb /tmp/ol025-modern > /tmp/modern-size.txt 2>> /tmp/modern.log
          node -e "import('/tmp/ol025-modern/daemon/dist/runtime/compatibility.js').then(()=>console.log('daemon-import-ok'))" >> /tmp/modern.log 2>&1
          printf 'daemon_import=%s\n' "$?" >> /tmp/modern-status.txt
          node -e "import('/tmp/ol025-modern/hook-adapter/dist/adapter.js').then(()=>console.log('hook-import-ok'))" >> /tmp/modern.log 2>&1
          printf 'hook_import=%s\n' "$?" >> /tmp/modern-status.txt
          node -e "import('/tmp/ol025-modern/installer/dist/package-builder.js').then(()=>console.log('installer-import-ok'))" >> /tmp/modern.log 2>&1
          printf 'installer_import=%s\n' "$?" >> /tmp/modern-status.txt
          tar -czf /tmp/ol025-modern.tar.gz -C /tmp ol025-modern >> /tmp/modern.log 2>&1
          printf 'archive=%s\n' "$?" >> /tmp/modern-status.txt
          cat /tmp/modern-status.txt
          tail -n 180 /tmp/modern.log
          exit 0
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ol025-modern-hoisted-deploy-diagnosis
          path: |
            /tmp/modern.log
            /tmp/modern-status.txt
            /tmp/modern-symlinks.txt
            /tmp/modern-files.txt
            /tmp/modern-size.txt
            /tmp/ol025-modern.tar.gz
          if-no-files-found: warn
          retention-days: 1
