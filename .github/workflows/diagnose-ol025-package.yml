name: Diagnose OL-025 package build

on:
  pull_request:
    branches:
      - agent/ol025-package-diagnosis-base

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false
      - name: Reconstruct exact OL-025 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          b64=b''.join((Path('.ol025-transfer')/f'chunk-{i:02d}.txt').read_bytes() for i in range(13))
          gz=base64.b64decode(b64, validate=True)
          patch=gzip.decompress(gz)
          if len(patch)!=307654 or hashlib.sha256(patch).hexdigest()!='81e01d5427b5dc75b1fab53d00824521b77aafcf9be4b90397dc388cd02d7fc9':
              raise SystemExit('patch mismatch')
          Path('/tmp/ol025.patch').write_bytes(patch)
          PY
          git apply --check /tmp/ol025.patch
          git apply /tmp/ol025.patch
          rm -rf .ol025-transfer .github/workflows/finalize-ol025.yml .github/workflows/diagnose-ol025-package.yml
      - run: pnpm install --frozen-lockfile
      - name: Build and capture installer source
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          find tools/local-installer -maxdepth 5 -type f | LC_ALL=C sort > /tmp/installer-files.txt
          tar --exclude='node_modules' -czf /tmp/ol025-installer-source.tar.gz \
            package.json pnpm-workspace.yaml pnpm-lock.yaml tsconfig.base.json tsconfig.test.json tools/local-installer
      - name: Capture package builder output
        shell: bash
        run: |
          set +e
          pnpm package:windows > /tmp/package.log 2>&1
          code=$?
          printf '%s\n' "$code" > /tmp/package-exit.txt
          tail -n 120 /tmp/package.log || true
          exit 0
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ol025-package-diagnosis-source
          path: |
            /tmp/package.log
            /tmp/package-exit.txt
            /tmp/installer-files.txt
            /tmp/ol025-installer-source.tar.gz
          if-no-files-found: error
          retention-days: 1
