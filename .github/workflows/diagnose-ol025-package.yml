name: Diagnose OL-025 package build

on:
  pull_request:
    branches:
      - agent/ol025-package-diagnosis-base

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false
      - name: Reconstruct exact OL-025 source and apply final package fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .ol025-diagnosis/package-fix-v3.patch | cut -d' ' -f1)" = "bb38d254c04714bbe8ab4f160c98966013108d2fedf61fce6c63e84e9a01f2bd"
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          b64=b''.join((Path('.ol025-transfer')/f'chunk-{i:02d}.txt').read_bytes() for i in range(13))
          gz=base64.b64decode(b64, validate=True)
          patch=gzip.decompress(gz)
          if len(patch)!=307654 or hashlib.sha256(patch).hexdigest()!='81e01d5427b5dc75b1fab53d00824521b77aafcf9be4b90397dc388cd02d7fc9':
              raise SystemExit('patch mismatch')
          Path('/tmp/ol025.patch').write_bytes(patch)
          PY
          git apply --check /tmp/ol025.patch
          git apply /tmp/ol025.patch
          git apply --check .ol025-diagnosis/package-fix-v3.patch
          git apply .ol025-diagnosis/package-fix-v3.patch
          rm -rf .ol025-transfer .ol025-diagnosis .github/workflows/finalize-ol025.yml .github/workflows/diagnose-ol025-package.yml
      - run: pnpm install --frozen-lockfile
      - name: Validate final package fix
        shell: bash
        run: |
          set -euo pipefail
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm vitest run packages/contracts/tests/local-installation.test.ts tools/local-installer/tests/*.test.ts
          pnpm build
      - name: Build and compare two independent packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ol025-package-a /tmp/ol025-package-b
          pnpm package:windows /tmp/ol025-package-a > /tmp/package-a.json 2> /tmp/package-a.stderr
          pnpm package:windows /tmp/ol025-package-b > /tmp/package-b.json 2> /tmp/package-b.stderr
          python - <<'PY'
          import json, os
          from pathlib import Path
          def load(path):
              lines=[line for line in Path(path).read_text().splitlines() if line.strip()]
              if len(lines)!=1:
                  raise SystemExit(f'invalid package output: {path}: {lines}')
              value=json.loads(lines[0])
              if value.get('ok') is not True:
                  raise SystemExit(f'package failed: {value}')
              return value
          a=load('/tmp/package-a.json')
          b=load('/tmp/package-b.json')
          if a['fingerprint'] != b['fingerprint'] or a['fileCount'] != b['fileCount']:
              raise SystemExit('package outputs are not deterministic')
          roots=[Path('/tmp/ol025-package-a/ownloop-windows-0.1.0'),Path('/tmp/ol025-package-b/ownloop-windows-0.1.0')]
          forbidden=[os.environ['GITHUB_WORKSPACE'].encode(), b'/home/runner/setup-pnpm', b'\\home\\runner']
          for root in roots:
              if not root.is_dir(): raise SystemExit(f'missing package root: {root}')
              links=[str(p) for p in root.rglob('*') if p.is_symlink()]
              if links: raise SystemExit(f'package contains symlinks: {links[:10]}')
              for rel in [
                  'daemon/pnpm-lock.yaml','hook-adapter/pnpm-lock.yaml','installer/pnpm-lock.yaml',
                  'daemon/node_modules/.bin','hook-adapter/node_modules/.bin','installer/node_modules/.bin',
                  'daemon/node_modules/.modules.yaml','hook-adapter/node_modules/.modules.yaml','installer/node_modules/.modules.yaml',
                  'daemon/node_modules/.pnpm-workspace-state-v1.json','hook-adapter/node_modules/.pnpm-workspace-state-v1.json','installer/node_modules/.pnpm-workspace-state-v1.json',
                  'daemon/node_modules/.pnpm','hook-adapter/node_modules/.pnpm','installer/node_modules/.pnpm',
              ]:
                  if (root/rel).exists(): raise SystemExit(f'generated deploy metadata remains: {rel}')
              for path in root.rglob('*'):
                  if path.is_file():
                      data=path.read_bytes()
                      if any(marker in data for marker in forbidden):
                          raise SystemExit(f'runner path leaked into package: {path.relative_to(root)}')
          Path('/tmp/package-summary.json').write_text(json.dumps({
              'fingerprint':a['fingerprint'],'fileCount':a['fileCount']
          },sort_keys=True)+'\n')
          PY
          PACKAGE=/tmp/ol025-package-a/ownloop-windows-0.1.0
          node -e "import('/tmp/ol025-package-a/ownloop-windows-0.1.0/daemon/dist/runtime/compatibility.js').then(()=>console.log('daemon-import-ok'))"
          node -e "import('/tmp/ol025-package-a/ownloop-windows-0.1.0/hook-adapter/dist/adapter.js').then(()=>console.log('hook-import-ok'))"
          node -e "import('/tmp/ol025-package-a/ownloop-windows-0.1.0/installer/dist/package-builder.js').then(()=>console.log('installer-import-ok'))"
          du -sb "$PACKAGE" > /tmp/package-size.txt
          find "$PACKAGE" -mindepth 1 -printf '%P\n' | LC_ALL=C sort > /tmp/package-files.txt
          tar -czf /tmp/ol025-package-a.tar.gz -C /tmp/ol025-package-a ownloop-windows-0.1.0
      - uses: actions/upload-artifact@v6
        with:
          name: ol025-final-package-proof
          path: |
            /tmp/package-a.json
            /tmp/package-b.json
            /tmp/package-a.stderr
            /tmp/package-b.stderr
            /tmp/package-summary.json
            /tmp/package-size.txt
            /tmp/package-files.txt
            /tmp/ol025-package-a.tar.gz
          if-no-files-found: error
          retention-days: 1
