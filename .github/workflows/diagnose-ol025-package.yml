name: Diagnose OL-025 package build

on:
  pull_request:
    branches:
      - agent/ol025-package-diagnosis-base

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false
      - name: Reconstruct exact OL-025 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          b64=b''.join((Path('.ol025-transfer')/f'chunk-{i:02d}.txt').read_bytes() for i in range(13))
          gz=base64.b64decode(b64, validate=True)
          patch=gzip.decompress(gz)
          if len(patch)!=307654 or hashlib.sha256(patch).hexdigest()!='81e01d5427b5dc75b1fab53d00824521b77aafcf9be4b90397dc388cd02d7fc9':
              raise SystemExit('patch mismatch')
          Path('/tmp/ol025.patch').write_bytes(patch)
          PY
          git apply --check /tmp/ol025.patch
          git apply /tmp/ol025.patch
          rm -rf .ol025-transfer .github/workflows/finalize-ol025.yml .github/workflows/diagnose-ol025-package.yml
      - run: pnpm install --frozen-lockfile
      - name: Reproduce deploy staging
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          rm -rf /tmp/ol025-staging
          mkdir -p /tmp/ol025-staging
          pnpm --filter @ownloop/daemon deploy --prod --offline --legacy /tmp/ol025-staging/daemon
          pnpm --filter @ownloop/hook-adapter deploy --prod --offline --legacy /tmp/ol025-staging/hook-adapter
          pnpm --filter @ownloop/local-installer deploy --prod --offline --legacy /tmp/ol025-staging/installer
          cp -a apps/web/dist /tmp/ol025-staging/web
          cp -a tools/local-installer/scripts /tmp/ol025-staging/launchers
          find /tmp/ol025-staging -mindepth 1 -printf '%P\n' | LC_ALL=C sort > /tmp/staging-files.txt
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/ol025-staging')
          found=[]
          for path in root.rglob('*'):
              rel=path.relative_to(root).as_posix()
              segments=rel.split('/')
              filename=segments[-1].lower()
              unconditional=(
                  '.git' in segments or filename in {'secrets-v1.json','runtime-v1.json','install-manifest.json','.env'}
                  or filename.startswith('.env.') or filename.endswith(('.sqlite','.sqlite3','.db'))
              )
              own_area=segments[0]
              before_node_modules='node_modules' not in segments
              scoped=(before_node_modules and (
                  'src' in segments or 'tests' in segments or '.test.' in filename or '.spec.' in filename
              ) and own_area in {'daemon','hook-adapter','installer'})
              if unconditional or scoped or path.is_symlink():
                  found.append(rel)
          Path('/tmp/forbidden-paths.txt').write_text('\n'.join(sorted(found))+'\n')
          PY
          tar --exclude='.git' --exclude='node_modules' -czf /tmp/ol025-reconstructed-source.tar.gz .
          tar -czf /tmp/ol025-staging.tar.gz -C /tmp ol025-staging
      - name: Capture package builder output
        shell: bash
        run: |
          set +e
          pnpm package:windows > /tmp/package.log 2>&1
          code=$?
          printf '%s\n' "$code" > /tmp/package-exit.txt
          cat /tmp/forbidden-paths.txt
          tail -n 120 /tmp/package.log || true
          exit 0
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ol025-package-staging-diagnosis
          path: |
            /tmp/package.log
            /tmp/package-exit.txt
            /tmp/forbidden-paths.txt
            /tmp/staging-files.txt
            /tmp/ol025-reconstructed-source.tar.gz
            /tmp/ol025-staging.tar.gz
          if-no-files-found: error
          retention-days: 1
