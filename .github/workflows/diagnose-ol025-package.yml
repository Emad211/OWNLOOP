name: Diagnose OL-025 package build

on:
  pull_request:
    branches:
      - agent/ol025-package-diagnosis-base

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false
      - name: Reconstruct exact OL-025 source and apply final package fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .ol025-diagnosis/package-fix-v4.patch | cut -d' ' -f1)" = "9f09ac9ad4c1534dfdbd53236cb7b892f6b4fa9fd3de2174d172e36ce4ff59be"
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          b64=b''.join((Path('.ol025-transfer')/f'chunk-{i:02d}.txt').read_bytes() for i in range(13))
          gz=base64.b64decode(b64, validate=True)
          patch=gzip.decompress(gz)
          if len(patch)!=307654 or hashlib.sha256(patch).hexdigest()!='81e01d5427b5dc75b1fab53d00824521b77aafcf9be4b90397dc388cd02d7fc9':
              raise SystemExit('patch mismatch')
          Path('/tmp/ol025.patch').write_bytes(patch)
          PY
          git apply --check /tmp/ol025.patch
          git apply /tmp/ol025.patch
          git apply --check .ol025-diagnosis/package-fix-v4.patch
          git apply .ol025-diagnosis/package-fix-v4.patch
          rm -rf .ol025-transfer .ol025-diagnosis .github/workflows/finalize-ol025.yml .github/workflows/diagnose-ol025-package.yml
      - run: pnpm install --frozen-lockfile
      - name: Validate final package fix
        shell: bash
        run: |
          set -euo pipefail
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm vitest run packages/contracts/tests/local-installation.test.ts tools/local-installer/tests/*.test.ts
          pnpm build
      - name: Capture package proof details
        shell: bash
        run: |
          set +e
          rm -rf /tmp/ol025-package-a /tmp/ol025-package-b
          pnpm package:windows /tmp/ol025-package-a > /tmp/package-a.stdout 2> /tmp/package-a.stderr
          echo "$?" > /tmp/package-a.exit
          pnpm package:windows /tmp/ol025-package-b > /tmp/package-b.stdout 2> /tmp/package-b.stderr
          echo "$?" > /tmp/package-b.exit
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          result={}
          def parse(name):
              lines=[line for line in Path(f'/tmp/package-{name}.stdout').read_text().splitlines() if line.strip()]
              result[f'{name}Lines']=lines
              if len(lines)!=1: return None
              try: return json.loads(lines[0])
              except Exception as exc:
                  result[f'{name}ParseError']=repr(exc); return None
          a=parse('a'); b=parse('b')
          result['a']=a; result['b']=b
          result['sameFingerprint']=bool(a and b and a.get('fingerprint') and a.get('fingerprint')==b.get('fingerprint'))
          result['sameFileCount']=bool(a and b and a.get('fileCount')==b.get('fileCount'))
          metadata=[
            'daemon/pnpm-lock.yaml','hook-adapter/pnpm-lock.yaml','installer/pnpm-lock.yaml',
            'daemon/node_modules/.bin','hook-adapter/node_modules/.bin','installer/node_modules/.bin',
            'daemon/node_modules/.modules.yaml','hook-adapter/node_modules/.modules.yaml','installer/node_modules/.modules.yaml',
            'daemon/node_modules/.pnpm-workspace-state-v1.json','hook-adapter/node_modules/.pnpm-workspace-state-v1.json','installer/node_modules/.pnpm-workspace-state-v1.json',
            'daemon/node_modules/.pnpm','hook-adapter/node_modules/.pnpm','installer/node_modules/.pnpm',
          ]
          markers=[os.environ['GITHUB_WORKSPACE'].encode(),b'/home/runner/setup-pnpm',b'\\home\\runner',b'file:///home/runner']
          for name in ('a','b'):
              root=Path(f'/tmp/ol025-package-{name}/ownloop-windows-0.1.0')
              result[f'{name}Exists']=root.is_dir()
              result[f'{name}Symlinks']=[str(p.relative_to(root)) for p in root.rglob('*') if p.is_symlink()] if root.is_dir() else None
              result[f'{name}Metadata']=[rel for rel in metadata if (root/rel).exists()] if root.is_dir() else None
              leaks=[]
              if root.is_dir():
                  for path in root.rglob('*'):
                      if path.is_file():
                          data=path.read_bytes()
                          if any(marker in data for marker in markers): leaks.append(str(path.relative_to(root)))
              result[f'{name}Leaks']=leaks
              manifests={}
              if root.is_dir():
                  for label,rel in {'daemon':'daemon/package.json','hook':'hook-adapter/package.json','installer':'installer/package.json'}.items():
                      manifests[label]=json.loads((root/rel).read_text())
              result[f'{name}Manifests']=manifests
              imports={}
              if root.is_dir():
                  for label,rel in {
                      'daemon':'daemon/dist/runtime/compatibility.js',
                      'hook':'hook-adapter/dist/adapter.js',
                      'installer':'installer/dist/package-builder.js',
                  }.items():
                      completed=subprocess.run(['node','-e',f"import({json.dumps((root/rel).as_uri())})"],capture_output=True,text=True)
                      imports[label]={'code':completed.returncode,'stderr':completed.stderr}
              result[f'{name}Imports']=imports
          Path('/tmp/package-proof-result.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          PY
          for name in a b; do
            root="/tmp/ol025-package-${name}/ownloop-windows-0.1.0"
            if test -d "$root"; then
              find "$root" -mindepth 1 -printf '%P\n' | LC_ALL=C sort > "/tmp/package-${name}.files"
              du -sb "$root" > "/tmp/package-${name}.size"
            fi
          done
          cat /tmp/package-proof-result.json
          exit 0
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ol025-final-package-proof-v4
          path: |
            /tmp/package-a.stdout
            /tmp/package-a.stderr
            /tmp/package-a.exit
            /tmp/package-b.stdout
            /tmp/package-b.stderr
            /tmp/package-b.exit
            /tmp/package-proof-result.json
            /tmp/package-a.files
            /tmp/package-b.files
            /tmp/package-a.size
            /tmp/package-b.size
          if-no-files-found: warn
          retention-days: 1
