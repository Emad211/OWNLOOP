name: Report OL-025 base tree

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  report:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-025-windows-installation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Report exact base tree object
        shell: bash
        env:
          EXPECTED_BASE: a33d1592545e5eeacaac0bd08421ae26f8b67d46
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$EXPECTED_BASE"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_BASE"
          echo "base-tree-sha=$(git rev-parse \"$EXPECTED_BASE^{tree}\")"
