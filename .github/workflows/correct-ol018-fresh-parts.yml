name: Correct OL-018 Fresh Parts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  correct:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/ol-018-provider-candidate-generation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Reconstruct and verify exact parts
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '2ecbd750e69f5ed06a01c08bb544cfde654f723707daa23bf6514098f101d9b1  .github/ol018-corrections/part-01-0' \
            '9813fa43b0523e83197cf92d85d23a153ed80f11518ed4c3f81e6f74222adf38  .github/ol018-corrections/part-01-1' \
            '8ac11d73d6c6f7075ad45f81b5094d6e7d45a4f7536cba7e8dbd61640b5ee84e  .github/ol018-corrections/part-01-2' \
            '05fef412b5143cdd8f619c3b00990432096aea22ce6d083e8368f0f5effe6978  .github/ol018-corrections/part-04-0' \
            '6a4d5d3593e2677a3b86f44e9197d64fbf4e22f45bf7295be790f9db13a4efd4  .github/ol018-corrections/part-04-1' \
            'c21c8ad2abcade53b053019955553f74173a838d06d53d66afe6b455fe854af1  .github/ol018-corrections/part-04-2' \
            | sha256sum --check --strict
          for file in .github/ol018-corrections/*; do
            test "$(wc -c < "$file")" -eq 2000
          done

          cat .github/ol018-corrections/part-01-* > /tmp/part-01
          cat .github/ol018-corrections/part-04-* > /tmp/part-04
          test "$(wc -c < /tmp/part-01)" -eq 6000
          test "$(wc -c < /tmp/part-04)" -eq 6000
          echo 'f18b65172cfbff4ff6ae2c859a26ba48b73b74d707852ce29301265b553ab45f  /tmp/part-01' | sha256sum --check
          echo 'aa63048cf67afba0da446e6fd22fc13edbebb32fbe165057ff94f8c14eab769a  /tmp/part-04' | sha256sum --check

          cp /tmp/part-01 .github/ol018-fresh/part-01
          cp /tmp/part-04 .github/ol018-fresh/part-04
          test "$(git hash-object .github/ol018-fresh/part-01)" = '32044e6eb585bf187d0940535fc67632c0fd1d25'
          test "$(git hash-object .github/ol018-fresh/part-04)" = '58c8954e64993439fec30a77c5ed89dc00a69060'

          cat .github/ol018-fresh/part-* > /tmp/ol018-fresh.b64
          test "$(wc -c < /tmp/ol018-fresh.b64)" -eq 36572
          echo '5380c9b19aba3ec497dc78ee3afc152ec2ee94ec20635d0fe2f9ae6d12887265  /tmp/ol018-fresh.b64' | sha256sum --check
          base64 --decode /tmp/ol018-fresh.b64 > /tmp/ol018-fresh.patch.gz
          test "$(wc -c < /tmp/ol018-fresh.patch.gz)" -eq 27427
          echo '2cd83f97e377f88c85a48ceb6f7c9aa08f3fa8b3d483418ad0b39d7dcabde847  /tmp/ol018-fresh.patch.gz' | sha256sum --check
          gzip --test /tmp/ol018-fresh.patch.gz
          gzip --decompress --stdout /tmp/ol018-fresh.patch.gz > /tmp/ol018-fresh.patch
          test "$(wc -c < /tmp/ol018-fresh.patch)" -eq 133785
          echo '55b88c1a81b86663bb5153ab666f3c29325b477e0bfe290907605186c90593be  /tmp/ol018-fresh.patch' | sha256sum --check
          git apply --check /tmp/ol018-fresh.patch

      - name: Remove correction files and verify scope
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/ol018-corrections/*
          git rm .github/workflows/correct-ol018-fresh-parts.yml
          cat > /tmp/expected <<'FILES'
          .github/ol018-corrections/part-01-0
          .github/ol018-corrections/part-01-1
          .github/ol018-corrections/part-01-2
          .github/ol018-corrections/part-04-0
          .github/ol018-corrections/part-04-1
          .github/ol018-corrections/part-04-2
          .github/ol018-fresh/part-01
          .github/ol018-fresh/part-04
          .github/workflows/correct-ol018-fresh-parts.yml
          FILES
          {
            git diff --name-only
            git diff --cached --name-only
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check

      - name: Publish corrected parts
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Correct checksum-verified OL-018 payload parts'
          git push origin "HEAD:${{ github.head_ref }}"
