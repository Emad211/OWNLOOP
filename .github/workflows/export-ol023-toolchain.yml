name: Export OL-023 Toolchain

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/ol-023-local-settings-privacy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Set up exact Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up exact pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Export exact source and runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ol023-toolchain/repo /tmp/ol023-toolchain/node
          tar --exclude=.git -cf - . | tar -xf - -C /tmp/ol023-toolchain/repo
          cp -a "$(dirname "$(dirname "$(command -v node)")")"/. /tmp/ol023-toolchain/node/
          (cd /tmp/ol023-toolchain && tar -czf /tmp/ownloop-ol023-toolchain.tar.gz repo node)
          sha256sum /tmp/ownloop-ol023-toolchain.tar.gz > /tmp/ownloop-ol023-toolchain.sha256

      - name: Upload exact toolchain
        uses: actions/upload-artifact@v6
        with:
          name: ownloop-ol023-toolchain
          path: |
            /tmp/ownloop-ol023-toolchain.tar.gz
            /tmp/ownloop-ol023-toolchain.sha256
          if-no-files-found: error
          retention-days: 1
