name: Finalize OL-019 Initial Implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/ol-019-candidate-validation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Capture verify and apply
        shell: bash
        run: |
          set +e
          bash .github/ol019-initial/verify-and-apply.sh > /tmp/ol019-verify.log 2>&1
          printf '%s\n' "$?" > /tmp/ol019-verify.status
          exit 0

      - name: Upload verify diagnostic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ol019-verify-diagnostic
          path: |
            /tmp/ol019-verify.log
            /tmp/ol019-verify.status
          if-no-files-found: error
          retention-days: 1

      - name: Require verify and apply
        shell: bash
        run: test "$(cat /tmp/ol019-verify.status)" -eq 0

      - name: Set up exact Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up exact pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Format OL-019 source
        run: pnpm format

      - name: Remove transfer files and verify exact scope
        run: bash .github/ol019-initial/cleanup-and-verify.sh

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish OL-019 implementation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement deterministic Candidate validation and selection'
          git push origin "HEAD:${{ github.head_ref }}"
