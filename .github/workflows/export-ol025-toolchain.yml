name: Export OL-025 Toolchain

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-025-windows-installation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Export exact source and runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ol025-toolchain/repo /tmp/ol025-toolchain/node
          tar --exclude=.git -cf - . | tar -xf - -C /tmp/ol025-toolchain/repo
          cp -a "$(dirname "$(dirname "$(command -v node)")")"/. /tmp/ol025-toolchain/node/
          (cd /tmp/ol025-toolchain && tar -czf /tmp/ownloop-ol025-toolchain.tar.gz repo node)
          sha256sum /tmp/ownloop-ol025-toolchain.tar.gz > /tmp/ownloop-ol025-toolchain.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: ownloop-ol025-toolchain
          path: |
            /tmp/ownloop-ol025-toolchain.tar.gz
            /tmp/ownloop-ol025-toolchain.sha256
          if-no-files-found: error
          retention-days: 1
