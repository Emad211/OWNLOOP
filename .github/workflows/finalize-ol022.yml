name: Finalize OL-022 Enriched Build Replay

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: finalize-ol022-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/ol-022-enriched-build-replay'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify exact head and transfer chunks
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(wc -c < .github/ol022-transfer/part-00)" = '4000'
          test "$(wc -c < .github/ol022-transfer/part-01)" = '4000'
          test "$(wc -c < .github/ol022-transfer/part-02)" = '4000'
          test "$(wc -c < .github/ol022-transfer/part-03)" = '4000'
          test "$(wc -c < .github/ol022-transfer/part-04)" = '4000'
          test "$(wc -c < .github/ol022-transfer/part-05)" = '4000'
          test "$(wc -c < .github/ol022-transfer/part-06)" = '4000'
          test "$(wc -c < .github/ol022-transfer/part-07)" = '4000'
          test "$(wc -c < .github/ol022-transfer/part-08)" = '4000'
          test "$(wc -c < .github/ol022-transfer/part-09)" = '1892'
          echo '23ecbb890a64ed23df06317070368a6314d13ca8f3d7c95119ab9d2ea6cb2976  .github/ol022-transfer/part-00' | sha256sum -c -
          echo '54ec12fc9af9f7dfb619c72ef64d57950c288db0abe687b6dbdaa3b0583029af  .github/ol022-transfer/part-01' | sha256sum -c -
          echo '57bcbe14a412d192cd7c2f0402b726d3ac21af34a2f6a83130c8886e61743418  .github/ol022-transfer/part-02' | sha256sum -c -
          echo '5e11a1446825d09dd8ac6ecb15121e0a5f63bb8dce86eae0ae08da7ef73346b1  .github/ol022-transfer/part-03' | sha256sum -c -
          echo 'bcf7ed33b7b36f660a1cc31d89a99158c22d7a329fad45faa5a00f0a1bfcb34a  .github/ol022-transfer/part-04' | sha256sum -c -
          echo 'dc86e75b2f1556a75ad743a63c39a3598e1a539241bebdda650ae802188656e4  .github/ol022-transfer/part-05' | sha256sum -c -
          echo '495b55988737e8892efbfc0e3eed2ec2058a7f26b9492413750c1b78e1f759dd  .github/ol022-transfer/part-06' | sha256sum -c -
          echo '94fe89379f8092f4c71e45e832eb8fd2e9320ae576b171817af6583b97764c96  .github/ol022-transfer/part-07' | sha256sum -c -
          echo '7fbc588cc2838351b7d75eb62dd00671cc076160e782c7b289ffa0ba91c69ed5  .github/ol022-transfer/part-08' | sha256sum -c -
          echo 'ea2e939dc2598c7cda1ac5bbd41b4660d8568a117443c87a8e0977ee4d08391f  .github/ol022-transfer/part-09' | sha256sum -c -

      - name: Reconstruct and apply exact OL-022 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ol022-transfer/part-{00..09} > /tmp/ol022.patch.gz.b64
          test "$(wc -c < /tmp/ol022.patch.gz.b64)" = '37892'
          echo '2a8ab70e7d74dbb94317770702695f5a67a2dacb441d05fefe1787f17ff3c54c  /tmp/ol022.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/ol022.patch.gz.b64 > /tmp/ol022.patch.gz
          test "$(wc -c < /tmp/ol022.patch.gz)" = '28419'
          echo 'e043954f742673780c85b5d9bb401c36a3a71472f450b25171bbc34b6d7fc511  /tmp/ol022.patch.gz' | sha256sum -c -
          gzip --decompress --stdout /tmp/ol022.patch.gz > /tmp/ol022.patch
          test "$(wc -c < /tmp/ol022.patch)" = '132511'
          echo '469a9f86f04c3af4949fcdca64f58b25d351c944e50d4262932455509038eff2  /tmp/ol022.patch' | sha256sum -c -
          git apply --check /tmp/ol022.patch
          git apply /tmp/ol022.patch
          rm -rf .github/ol022-transfer
          rm -f .github/workflows/finalize-ol022.yml
          git diff --check

      - name: Set up exact Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up exact pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit and verify exact final scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'OL-022: Produce deterministic enriched Build Replay'
          git fetch origin main --depth=1
          git diff --check origin/main HEAD
          git diff --name-only origin/main HEAD | LC_ALL=C sort > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          AGENTS.md
          README.md
          apps/daemon/src/candidate-validation/processor.integration.test.ts
          apps/daemon/src/enriched-replay/README.md
          apps/daemon/src/enriched-replay/builder.test.ts
          apps/daemon/src/enriched-replay/builder.ts
          apps/daemon/src/enriched-replay/constants.ts
          apps/daemon/src/enriched-replay/index.ts
          apps/daemon/src/enriched-replay/processor.test.ts
          apps/daemon/src/enriched-replay/processor.ts
          apps/daemon/src/index.ts
          apps/daemon/src/replay/index.ts
          apps/daemon/src/replay/routes.ts
          apps/web/src/App.test.tsx
          apps/web/src/App.tsx
          apps/web/src/BuildReplay.test.tsx
          apps/web/src/BuildReplay.tsx
          apps/web/src/api.test.ts
          apps/web/src/api.ts
          apps/web/src/styles.css
          docs/adr/0024-deterministic-enriched-build-replay.md
          packages/contracts/src/enriched-build-replay.ts
          packages/contracts/src/index.ts
          packages/contracts/tests/enriched-build-replay.test.ts
          EOF
          sed -i 's/^          //' /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(wc -l < /tmp/actual-files)" = '24'
          test ! -e .github/ol022-transfer
          test ! -e .github/workflows/export-ol022-toolchain.yml
          test ! -e .github/workflows/finalize-ol022.yml
          test -z "$(git status --porcelain)"

      - name: Publish exact verified head
        shell: bash
        run: git push origin HEAD:${{ github.head_ref }}
