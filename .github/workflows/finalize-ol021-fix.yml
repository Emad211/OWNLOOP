name: Finalize OL-021 Whitespace Fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/ol-021-moment-interactions'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify transfer, apply source, and normalize ADR
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          for index in {00..12}; do test "$(wc -c < .github/ol021-transfer/part-${index})" = '4000'; done
          test "$(wc -c < .github/ol021-transfer/part-13)" = '660'
          cat .github/ol021-transfer/part-{00..13} > /tmp/ol021.patch.gz.b64
          test "$(wc -c < /tmp/ol021.patch.gz.b64)" = '52660'
          echo '138471e3969bddd3eeec1ba822aadccd899cc89d18c808f251ddfa9467943c79  /tmp/ol021.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/ol021.patch.gz.b64 > /tmp/ol021.patch.gz
          test "$(wc -c < /tmp/ol021.patch.gz)" = '39493'
          echo 'debc88b3af48365bb8bd57924b1991de1a1227c768cf91167e3c0d2030880d44  /tmp/ol021.patch.gz' | sha256sum -c -
          gzip --decompress --stdout /tmp/ol021.patch.gz > /tmp/ol021.patch
          test "$(wc -c < /tmp/ol021.patch)" = '198083'
          echo '8423543573ddbfbaa8018eb42ddd8c0b6d97414bcde2c8dbc984b8e632934761  /tmp/ol021.patch' | sha256sum -c -
          git apply --check /tmp/ol021.patch
          git apply /tmp/ol021.patch
          sed -i 's/[[:space:]]\+$//' docs/adr/0023-append-only-moment-interactions-and-ownership-records.md
          rm -rf .github/ol021-transfer
          rm -f .github/workflows/finalize-ol021.yml .github/workflows/finalize-ol021-fix.yml
          git diff --check

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Commit, verify exact scope, and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'OL-021: Persist append-only Moment interactions'
          git fetch origin main --depth=1
          git diff --check origin/main HEAD
          git diff --name-only origin/main HEAD | LC_ALL=C sort > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          AGENTS.md
          README.md
          apps/daemon/src/candidate-validation/processor.integration.test.ts
          apps/daemon/src/ingress/server.ts
          apps/daemon/src/moment-interactions/README.md
          apps/daemon/src/moment-interactions/constants.ts
          apps/daemon/src/moment-interactions/index.ts
          apps/daemon/src/moment-interactions/processor.test.ts
          apps/daemon/src/moment-interactions/processor.ts
          apps/daemon/src/ownership-moments/projection.ts
          apps/daemon/src/persistence/index.ts
          apps/daemon/src/persistence/migration-definitions.ts
          apps/daemon/src/persistence/migrations.test.ts
          apps/daemon/src/persistence/repositories/moment-interactions.ts
          apps/daemon/src/replay/responses.ts
          apps/daemon/src/replay/routes.ts
          apps/web/src/App.test.tsx
          apps/web/src/App.tsx
          apps/web/src/api.test.ts
          apps/web/src/api.ts
          docs/adr/0023-append-only-moment-interactions-and-ownership-records.md
          packages/contracts/src/index.ts
          packages/contracts/src/moment-interactions.ts
          packages/contracts/src/replay.ts
          packages/contracts/tests/moment-interactions.test.ts
          EOF
          sed -i 's/^          //' /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(wc -l < /tmp/actual-files)" = '25'
          test ! -e .github/ol021-transfer
          test ! -e .github/workflows/export-ol021-toolchain.yml
          test ! -e .github/workflows/finalize-ol021.yml
          test ! -e .github/workflows/finalize-ol021-fix.yml
          test -z "$(git status --porcelain)"
          git push origin HEAD:${{ github.head_ref }}
