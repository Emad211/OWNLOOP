name: Finalize OL-025 Windows pnpm runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finalize-ol025-windows-pnpm-runner
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-025-windows-installation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Apply bounded Windows runner fix
        shell: bash
        env:
          EXPECTED_PARENT_HEAD: a469fafba9fefbd2410b78a6f823e0353975711b
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" HEAD)" = '.github/workflows/finalize-ol025-windows-pnpm-runner.yml'

          python - <<'PY'
          from pathlib import Path

          source_path = Path('tools/local-installer/src/package-builder.ts')
          source = source_path.read_text(encoding='utf-8')

          runner_type = '''export type PackageBuildRunner = (
            executable: string,
            args: readonly string[],
            options: Readonly<{ cwd: string }>,
          ) => Promise<{ stdout: string; stderr: string }>;
          '''
          helper = '''
          export type PackageBuildInvocation = Readonly<{
            executable: string;
            args: readonly string[];
          }>;

          export type PackageBuildInvocationOptions = Readonly<{
            platform?: NodeJS.Platform;
            environment?: Readonly<Record<string, string | undefined>>;
            nodeExecutable?: string;
          }>;

          const PNPM_JAVASCRIPT_ENTRYPOINT_PATTERN = /(?:^|[\\/])pnpm(?:\\.cjs|\\.js)$/iu;

          export function resolvePackageBuildInvocation(
            executable: string,
            args: readonly string[],
            options: PackageBuildInvocationOptions = {},
          ): PackageBuildInvocation {
            if ((options.platform ?? process.platform) !== "win32" || executable !== "pnpm") {
              return Object.freeze({ executable, args: Object.freeze([...args]) });
            }

            const environment = options.environment ?? process.env;
            const pnpmEntrypoint = environment.npm_execpath;
            const nodeExecutable = options.nodeExecutable ?? process.execPath;
            if (
              pnpmEntrypoint === undefined ||
              !isAbsolute(pnpmEntrypoint) ||
              pnpmEntrypoint.includes("\\0") ||
              !PNPM_JAVASCRIPT_ENTRYPOINT_PATTERN.test(pnpmEntrypoint) ||
              !isAbsolute(nodeExecutable) ||
              nodeExecutable.includes("\\0")
            ) {
              throw new PackageBuilderError("runtime_incompatible");
            }

            return Object.freeze({
              executable: resolve(nodeExecutable),
              args: Object.freeze([resolve(pnpmEntrypoint), ...args]),
            });
          }
          '''
          if source.count(runner_type) != 1:
              raise SystemExit('unexpected runner type anchor')
          source = source.replace(runner_type, runner_type + helper)

          old_exec = '''  const result = await execFileAsync(executable, [...args], {
              cwd: options.cwd,
              windowsHide: true,
              timeout: 10 * 60_000,
              maxBuffer: 16 * 1024 * 1024,
            });
          '''
          new_exec = '''  const invocation = resolvePackageBuildInvocation(executable, args);
            const result = await execFileAsync(invocation.executable, [...invocation.args], {
              cwd: options.cwd,
              windowsHide: true,
              timeout: 10 * 60_000,
              maxBuffer: 16 * 1024 * 1024,
            });
          '''
          if source.count(old_exec) != 1:
              raise SystemExit('unexpected execFile anchor')
          source = source.replace(old_exec, new_exec)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('tools/local-installer/tests/package-command.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          import_anchor = 'import { describe, expect, it } from "vitest";\n'
          import_addition = '''import {
            resolvePackageBuildInvocation,
          } from "../src/index.js";
          '''
          if tests.count(import_anchor) != 1:
              raise SystemExit('unexpected test import anchor')
          tests = tests.replace(import_anchor, import_anchor + '\n' + import_addition)

          close_anchor = '''  });
          });
          '''
          additions = '''  });

            it("invokes the pnpm JavaScript entrypoint through Node on Windows", () => {
              expect(
                resolvePackageBuildInvocation("pnpm", ["--version"], {
                  platform: "win32",
                  environment: { npm_execpath: "/pnpm/bin/pnpm.cjs" },
                  nodeExecutable: "/node/node.exe",
                }),
              ).toEqual({
                executable: "/node/node.exe",
                args: ["/pnpm/bin/pnpm.cjs", "--version"],
              });
            });

            it("fails closed when Windows has no absolute pnpm JavaScript entrypoint", () => {
              expect(() =>
                resolvePackageBuildInvocation("pnpm", ["build"], {
                  platform: "win32",
                  environment: {},
                  nodeExecutable: "/node/node.exe",
                }),
              ).toThrowError(expect.objectContaining({ code: "runtime_incompatible" }));
            });
          });
          '''
          if tests.count(close_anchor) != 1:
              raise SystemExit('unexpected test close anchor')
          tests = tests.replace(close_anchor, additions)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: pnpm exec biome format --write tools/local-installer/src/package-builder.ts tools/local-installer/tests/package-command.test.ts

      - name: Run full repository gates and package proof
        shell: bash
        run: |
          set -euo pipefail
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          rm -rf /tmp/ol025-windows-runner-package
          pnpm package:windows /tmp/ol025-windows-runner-package

      - name: Publish verified source-only fix
        shell: bash
        run: |
          set -euo pipefail
          git clean -fdX
          git diff --check
          mapfile -t files < <(git status --short | sed 's/^...//' | LC_ALL=C sort)
          expected=(
            tools/local-installer/src/package-builder.ts
            tools/local-installer/tests/package-command.test.ts
          )
          test "${#files[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${files[$index]}" = "${expected[$index]}"
          done
          git add "${expected[@]}"
          git diff --cached --check
          git config user.name Emad211
          git config user.email 82148680+Emad211@users.noreply.github.com
          git commit -m 'fix(ol-025): invoke pnpm safely on Windows'
          git push origin "HEAD:${{ github.head_ref }}"
