name: Diagnose OL-018 Transfer Tail

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/ol-018-provider-candidate-generation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch with history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Diagnose historical transfer suffix
        shell: bash
        run: |
          set -u
          old_blob=f1f4b23764a15cee4994487741e926684d89296a
          current=.github/ol018-transfer/part-04
          recovered=/tmp/part-05
          report=/tmp/ol018-transfer-report.txt
          : > "$report"

          git cat-file blob "$old_blob" > /tmp/ol018-combined-tail
          printf 'old_blob_size=%s\n' "$(wc -c < /tmp/ol018-combined-tail)" >> "$report"
          printf 'current_part04_size=%s\n' "$(wc -c < "$current")" >> "$report"
          printf 'current_part04_git_blob=%s\n' "$(git hash-object "$current")" >> "$report"

          python3 - <<'PY' >> /tmp/ol018-transfer-report.txt
          from pathlib import Path

          old = Path('/tmp/ol018-combined-tail').read_bytes()
          current = Path('.github/ol018-transfer/part-04').read_bytes()
          prefix = old.startswith(current)
          print(f'prefix_match={str(prefix).lower()}')
          if prefix:
              suffix = old[len(current):]
              Path('/tmp/part-05').write_bytes(suffix)
              print(f'recovered_suffix_size={len(suffix)}')
          else:
              common = 0
              for left, right in zip(old, current):
                  if left != right:
                      break
                  common += 1
              print(f'common_prefix_size={common}')
          PY

          if test -f "$recovered"; then
            cat .github/ol018-transfer/part-00 \
                .github/ol018-transfer/part-01 \
                .github/ol018-transfer/part-02 \
                .github/ol018-transfer/part-03 \
                .github/ol018-transfer/part-04 \
                "$recovered" > /tmp/ol018-payload.b64
            printf 'payload_b64_size=%s\n' "$(wc -c < /tmp/ol018-payload.b64)" >> "$report"
            printf 'payload_b64_sha256=%s\n' "$(sha256sum /tmp/ol018-payload.b64 | cut -d' ' -f1)" >> "$report"
            if base64 --decode /tmp/ol018-payload.b64 > /tmp/ol018.patch.gz 2>/tmp/base64-error; then
              printf 'base64_decode=success\n' >> "$report"
              printf 'gzip_size=%s\n' "$(wc -c < /tmp/ol018.patch.gz)" >> "$report"
              printf 'gzip_sha256=%s\n' "$(sha256sum /tmp/ol018.patch.gz | cut -d' ' -f1)" >> "$report"
              if gzip --test /tmp/ol018.patch.gz 2>/tmp/gzip-error; then
                printf 'gzip_test=success\n' >> "$report"
                gzip --decompress --stdout /tmp/ol018.patch.gz > /tmp/ol018.patch
                printf 'raw_patch_size=%s\n' "$(wc -c < /tmp/ol018.patch)" >> "$report"
                printf 'raw_patch_sha256=%s\n' "$(sha256sum /tmp/ol018.patch | cut -d' ' -f1)" >> "$report"
                if git apply --check /tmp/ol018.patch 2>/tmp/apply-error; then
                  printf 'git_apply_check=success\n' >> "$report"
                else
                  printf 'git_apply_check=failure\n' >> "$report"
                  cat /tmp/apply-error >> "$report"
                fi
              else
                printf 'gzip_test=failure\n' >> "$report"
                cat /tmp/gzip-error >> "$report"
              fi
            else
              printf 'base64_decode=failure\n' >> "$report"
              cat /tmp/base64-error >> "$report"
            fi
          fi

          cat "$report"

      - name: Upload diagnostic
        uses: actions/upload-artifact@v6
        with:
          name: ol018-transfer-tail-diagnostic
          path: /tmp/ol018-transfer-report.txt
          if-no-files-found: error
          retention-days: 1
