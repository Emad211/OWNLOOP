name: Reconstruct OL-018 Partial Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  reconstruct:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/ol-018-provider-candidate-generation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch with history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct verified prefix and partial patch
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/ol018-reconstruction
          mkdir -p "$out"
          old_blob=f1f4b23764a15cee4994487741e926684d89296a
          git cat-file blob "$old_blob" > "$out/historical-part04-plus-prefix"

          cp .github/ol018-transfer/part-04 "$out/correct-part-03"
          head -c 6000 "$out/historical-part04-plus-prefix" > "$out/correct-part-04"
          tail -c +6001 "$out/historical-part04-plus-prefix" > "$out/part-05-known-prefix"

          test "$(wc -c < "$out/correct-part-03")" -eq 6000
          test "$(wc -c < "$out/correct-part-04")" -eq 6000
          test "$(wc -c < "$out/part-05-known-prefix")" -eq 264

          cat .github/ol018-transfer/part-00 \
              .github/ol018-transfer/part-01 \
              .github/ol018-transfer/part-02 \
              "$out/correct-part-03" \
              "$out/correct-part-04" \
              "$out/part-05-known-prefix" > "$out/known-prefix.b64"
          test "$(wc -c < "$out/known-prefix.b64")" -eq 30264
          base64 --decode "$out/known-prefix.b64" > "$out/partial.patch.gz"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import zlib

          out = Path('/tmp/ol018-reconstruction')
          compressed = (out / 'partial.patch.gz').read_bytes()
          decoder = zlib.decompressobj(16 + zlib.MAX_WBITS)
          raw = decoder.decompress(compressed)
          (out / 'partial.patch').write_bytes(raw)
          report = [
              f'known_base64_size={(out / "known-prefix.b64").stat().st_size}',
              f'partial_gzip_size={len(compressed)}',
              f'partial_gzip_sha256={hashlib.sha256(compressed).hexdigest()}',
              f'partial_raw_size={len(raw)}',
              f'partial_raw_sha256={hashlib.sha256(raw).hexdigest()}',
              f'gzip_eof={str(decoder.eof).lower()}',
              f'missing_base64_size={34004 - (out / "known-prefix.b64").stat().st_size}',
          ]
          (out / 'report.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          PY

      - name: Upload reconstruction
        uses: actions/upload-artifact@v6
        with:
          name: ol018-partial-patch-reconstruction
          path: /tmp/ol018-reconstruction
          if-no-files-found: error
          retention-days: 1
