name: Finalize OL-027 Codex capability route

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Apply exact capability route composition
        run: python .ol027-transfer/finalize-capability-route.py

      - run: pnpm install --frozen-lockfile

      - name: Format exact source
        run: |
          pnpm exec biome check --write \
            apps/daemon/src/codex-capability/routes.ts \
            apps/daemon/src/codex-capability/routes.test.ts \
            apps/daemon/src/codex-capability/index.ts \
            apps/daemon/src/ingress/server.ts

      - name: Capture route test diagnostics
        shell: bash
        run: |
          set +e
          pnpm vitest run \
            apps/daemon/src/codex-capability/routes.test.ts \
            apps/daemon/src/codex-capability/projector.test.ts \
            apps/daemon/src/ingress/server.test.ts \
            > /tmp/ol027-capability-route-tests.log 2>&1
          code=$?
          printf '%s\n' "$code" > /tmp/ol027-capability-route-tests.exit
          cat /tmp/ol027-capability-route-tests.log
          exit 0

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ol027-capability-route-tests
          path: |
            /tmp/ol027-capability-route-tests.log
            /tmp/ol027-capability-route-tests.exit
          if-no-files-found: error
          retention-days: 1
