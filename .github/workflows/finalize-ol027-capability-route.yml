name: Finalize OL-027 Codex capability route

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Apply exact capability route composition
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2886063c2f00ddea2117acb650079ecc90d6f1f2"
          python .ol027-transfer/finalize-capability-route.py
          rm -rf .ol027-transfer .github/workflows/finalize-ol027-capability-route.yml

      - run: pnpm install --frozen-lockfile

      - name: Format capability route source
        run: |
          pnpm exec biome check --write \
            apps/daemon/src/codex-capability/routes.ts \
            apps/daemon/src/codex-capability/routes.test.ts \
            apps/daemon/src/codex-capability/index.ts \
            apps/daemon/src/ingress/server.ts

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test authenticated capability route
        run: |
          pnpm vitest run \
            apps/daemon/src/codex-capability/routes.test.ts \
            apps/daemon/src/codex-capability/projector.test.ts \
            apps/daemon/src/ingress/server.test.ts

      - name: Test full repository
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish clean capability route head
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .ol027-transfer
          test ! -e .github/workflows/finalize-ol027-capability-route.yml
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name 'Emad211'
          git config user.email '82148680+Emad211@users.noreply.github.com'
          git commit -m 'OL-027: Expose authenticated Codex capability status'
          git push origin "HEAD:${{ github.head_ref }}"
