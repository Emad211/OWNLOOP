name: Finalize follow-up checkpoint v2

on:
  push:
    branches:
      - agent/ol-028-persian-attention-loop-v0
    paths:
      - .github/workflows/finalize-followup-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact Biome formatting
        run: pnpm format

      - name: Verify canonical package scripts
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expected = 'biome format biome.json package.json tsconfig.base.json tsconfig.test.json apps packages tools';
          if (pkg.scripts['format:check'] !== expected) {
            throw new Error('format:check is not canonical');
          }
          NODE

      - name: Verify formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build verified Windows package
        run: pnpm package:windows

      - name: Record checkpoint
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path('docs/دفتر پیشرفت و نکات بسیار مهم.md')
          text = path.read_text(encoding='utf-8')
          marker = '## ۱۲) آخرین checkpoint خودکار'
          section = f'''{marker}

          ```text
          source commit: {os.environ['SOURCE_SHA']}
          workflow run:  #{os.environ['RUN_NUMBER']}
          run id:        {os.environ['RUN_ID']}
          milestone:     actionable follow-up summary
          ```

          این checkpoint پس از موفقیت format، lint، typecheck، تمام تست‌ها، build و ساخت بستهٔ Windows ثبت شد.

          قابلیت‌های تأییدشده:

          - استخراج follow-up Moment IDs از interaction state واقعی؛
          - نگه‌داری ترتیب projection و سقف نمایش سه مورد؛
          - افزودن/حذف deterministic ID بدون duplicate؛
          - شمارنده و فهرست با یک Set مشترک؛
          - عنوان فارسی یا fallback کنترل‌شده؛
          - عدم نمایش Moment حل‌شده؛
          - لینک محدود به شواهد همان Run؛
          - بدون endpoint، persistence یا backend تازه.

          هنوز تأییدنشده: live AvalAI، اجرای نصب‌شده و پذیرش بصری/رفتاری کاربر.
          '''
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n\n' + section.strip() + '\n'
          else:
              text = text.rstrip() + '\n\n---\n\n' + section.strip() + '\n'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove all one-shot workflows
        shell: bash
        run: |
          rm -f .github/workflows/format-once.yml
          rm -f .github/workflows/finalize-followup-once.yml
          rm -f .github/workflows/finalize-followup-v2.yml

      - name: Commit formatted checkpoint and self-removal
        shell: bash
        run: |
          git config user.name 'ownloop-checkpoint-bot'
          git config user.email 'ownloop-checkpoint-bot@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: finalize actionable follow-up checkpoint'
          git push origin HEAD:agent/ol-028-persian-attention-loop-v0
