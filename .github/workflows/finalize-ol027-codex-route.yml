name: Finalize OL-027 Codex route

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Apply exact route and diagnostics edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "796f31cea2db767e623b93ebce094703909523ea"
          python - <<'PY'
          from pathlib import Path

          index_file = Path("packages/contracts/src/index.ts")
          index_text = index_file.read_text(encoding="utf-8")
          index_anchor = '''export function formatBootstrapName(name: string): string {
            return `${name} ${BOOTSTRAP_LABEL}`;
          }
          '''
          agent_exports = '''
          export type {
            AgentIngressHookIdentity,
            IngressAgentSource,
            SupportedAgentHookName,
          } from "./agent-ingress.js";
          export {
            AgentIngressHookIdentitySchema,
            INGRESS_AGENT_SOURCES,
            IngressAgentSourceSchema,
            isSupportedAgentHook,
            MAX_INGRESS_AGENT_HOOK_IDENTITIES,
            SUPPORTED_AGENT_HOOK_NAMES,
            SupportedAgentHookNameSchema,
          } from "./agent-ingress.js";
          '''
          if index_text.count(index_anchor) != 1 or agent_exports.strip() in index_text:
              raise SystemExit("contracts index export precondition failed")
          index_file.write_text(index_text.replace(index_anchor, index_anchor + agent_exports), encoding="utf-8")

          diagnostics_contract = Path("packages/contracts/src/diagnostics-dashboard.ts")
          diagnostics_text = diagnostics_contract.read_text(encoding="utf-8")
          old_hook_import = '''import {
            SUPPORTED_CLAUDE_HOOK_NAMES,
            SupportedClaudeHookNameSchema,
          } from "./claude-hook-common.js";
          '''
          new_hook_import = '''import {
            AgentIngressHookIdentitySchema,
            type IngressAgentSource,
            IngressAgentSourceSchema,
            MAX_INGRESS_AGENT_HOOK_IDENTITIES,
            type SupportedAgentHookName,
            SupportedAgentHookNameSchema,
          } from "./agent-ingress.js";
          '''
          if diagnostics_text.count(old_hook_import) != 1:
              raise SystemExit("diagnostics Hook import precondition failed")
          diagnostics_text = diagnostics_text.replace(old_hook_import, new_hook_import)

          old_hook_schema = '''export const DiagnosticsHookCountV1Schema = z.strictObject({
            hookName: SupportedClaudeHookNameSchema,
            count: safeCountSchema,
          });
          export type DiagnosticsHookCountV1 = z.infer<typeof DiagnosticsHookCountV1Schema>;

          const hookCountsSchema = z
            .array(DiagnosticsHookCountV1Schema)
            .max(SUPPORTED_CLAUDE_HOOK_NAMES.length)
            .superRefine((value, context) => {
              if (!isSortedUnique(value.map((item) => item.hookName))) {
                context.addIssue({ code: "custom", message: "Hook counts must be sorted and unique." });
              }
            });
          '''
          new_hook_schema = '''export const DiagnosticsHookCountV1Schema = z
            .strictObject({
              source: IngressAgentSourceSchema.optional(),
              hookName: SupportedAgentHookNameSchema,
              count: safeCountSchema,
            })
            .superRefine((value, context) => {
              const parsed = AgentIngressHookIdentitySchema.safeParse({
                source: value.source ?? "claude_code",
                hookName: value.hookName,
              });
              if (!parsed.success) {
                context.addIssue({
                  code: "custom",
                  path: ["hookName"],
                  message: "The diagnostic Hook does not belong to its ingress source.",
                });
              }
            });
          export type DiagnosticsHookCountV1 = z.infer<typeof DiagnosticsHookCountV1Schema>;

          function diagnosticHookIdentityKey(value: Readonly<{
            source?: IngressAgentSource | undefined;
            hookName: SupportedAgentHookName;
          }>): string {
            return `${value.source ?? "claude_code"}:${value.hookName}`;
          }

          const hookCountsSchema = z
            .array(DiagnosticsHookCountV1Schema)
            .max(MAX_INGRESS_AGENT_HOOK_IDENTITIES)
            .superRefine((value, context) => {
              if (!isSortedUnique(value.map(diagnosticHookIdentityKey))) {
                context.addIssue({ code: "custom", message: "Hook counts must be sorted and unique." });
              }
            });
          '''
          if diagnostics_text.count(old_hook_schema) != 1:
              raise SystemExit("diagnostics Hook schema precondition failed")
          diagnostics_contract.write_text(
              diagnostics_text.replace(old_hook_schema, new_hook_schema),
              encoding="utf-8",
          )

          server_file = Path("apps/daemon/src/ingress/server.ts")
          server_text = server_file.read_text(encoding="utf-8")
          response_import = 'import { acceptedResponse, rejectedResponse, summarizeZodError } from "./responses.js";\n'
          codex_import = 'import { CODEX_INGRESS_ROUTE, registerCodexIngressRoute } from "./codex-route.js";\n'
          if server_text.count(response_import) != 1 or codex_import in server_text:
              raise SystemExit("Codex route import precondition failed")
          server_text = server_text.replace(response_import, codex_import + response_import)

          constant_anchor = 'export const INGRESS_BODY_LIMIT_BYTES = 1024 * 1024;\n'
          if server_text.count(constant_anchor) != 1:
              raise SystemExit("Codex route export precondition failed")
          server_text = server_text.replace(
              constant_anchor,
              constant_anchor + '\nexport { CODEX_INGRESS_ROUTE };\n',
          )

          static_anchor = '  const staticSite = createContainedStaticSite(dependencies.replay?.webRoot);\n'
          registration = '''  registerCodexIngressRoute(server, {
            persistence,
            tokenVerifier,
            hmacKey,
            ...(homePath === undefined ? {} : { homePath }),
            clock,
            receiptIdGenerator,
            ...(diagnostics === undefined ? {} : { diagnostics }),
            customSecretFieldPatterns: () =>
              dependencies.settings?.getCustomSecretFieldPatterns() ??
              dependencies.customSecretFieldPatterns?.() ??
              [],
          });

          '''
          if server_text.count(static_anchor) != 1 or registration.strip() in server_text:
              raise SystemExit("Codex route registration precondition failed")
          server_file.write_text(
              server_text.replace(static_anchor, registration + static_anchor),
              encoding="utf-8",
          )

          ingress_index = Path("apps/daemon/src/ingress/index.ts")
          ingress_index_text = ingress_index.read_text(encoding="utf-8")
          index_route_anchor = '  createLoopbackIngressServer,\n'
          if ingress_index_text.count(index_route_anchor) != 1 or "  CODEX_INGRESS_ROUTE,\n" in ingress_index_text:
              raise SystemExit("ingress route export precondition failed")
          ingress_index.write_text(
              ingress_index_text.replace(
                  index_route_anchor,
                  '  CODEX_INGRESS_ROUTE,\n' + index_route_anchor,
              ),
              encoding="utf-8",
          )
          PY
          rm .github/workflows/finalize-ol027-codex-route.yml

      - run: pnpm install --frozen-lockfile

      - name: Format route source
        run: |
          pnpm exec biome check --write \
            packages/contracts/src/agent-ingress.ts \
            packages/contracts/src/diagnostics-dashboard.ts \
            packages/contracts/tests/agent-ingress.test.ts \
            packages/contracts/tests/diagnostics-multi-agent.test.ts \
            apps/daemon/src/ingress/diagnostics.ts \
            apps/daemon/src/ingress/codex-route.ts \
            apps/daemon/src/ingress/server.ts \
            apps/daemon/src/ingress/index.ts \
            apps/daemon/src/ingress/codex-server.test.ts \
            apps/daemon/src/local-settings/diagnostics.ts \
            apps/daemon/src/local-settings/diagnostics-multi-agent.test.ts

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test Codex route and diagnostics
        run: pnpm vitest run packages/contracts/tests/agent-ingress.test.ts packages/contracts/tests/diagnostics-multi-agent.test.ts apps/daemon/src/ingress/codex-server.test.ts apps/daemon/src/ingress/server.test.ts apps/daemon/src/local-settings/diagnostics-multi-agent.test.ts apps/daemon/src/local-settings/service.test.ts

      - name: Test full repository
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish clean route head
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/finalize-ol027-codex-route.yml
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name 'Emad211'
          git config user.email '82148680+Emad211@users.noreply.github.com'
          git commit -m 'OL-027: Add authenticated Codex ingress route'
          git push origin "HEAD:${{ github.head_ref }}"
