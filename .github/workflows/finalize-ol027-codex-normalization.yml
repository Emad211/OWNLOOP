name: Finalize OL-027 Codex normalization

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Apply exact normalization edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "66e6594bd263ada81d28a823bedfb70886240a8f"
          python .ol027-transfer/finalize-codex-normalization.py

      - run: pnpm install --frozen-lockfile

      - name: Capture Biome diagnostics
        shell: bash
        run: |
          set +e
          pnpm exec biome check --write \
            packages/event-model/src/normalized-event.ts \
            packages/event-model/tests/normalized-event.test.ts \
            apps/daemon/src/persistence/multi-agent-event-taxonomy-migration.ts \
            apps/daemon/src/persistence/migration-definitions.ts \
            apps/daemon/src/persistence/migration-v19.test.ts \
            apps/daemon/src/persistence/migration-v20.test.ts \
            apps/daemon/src/lifecycle/processor.ts \
            apps/daemon/src/lifecycle/codex-lifecycle.test.ts \
            apps/daemon/src/normalization/processor.ts \
            apps/daemon/src/normalization/codex-normalization.test.ts \
            > /tmp/ol027-normalization-biome.log 2>&1
          code=$?
          printf '%s\n' "$code" > /tmp/ol027-normalization-biome.exit
          cat /tmp/ol027-normalization-biome.log
          exit 0

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ol027-normalization-biome
          path: |
            /tmp/ol027-normalization-biome.log
            /tmp/ol027-normalization-biome.exit
          if-no-files-found: error
          retention-days: 1
