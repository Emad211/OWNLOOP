name: Finalize OL-027 Codex normalization

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - name: Capture exact normalization edit diagnostics
        shell: bash
        run: |
          set +e
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "PARENT=$(git rev-parse HEAD^)"
            python - <<'PY'
          from pathlib import Path

          migration = Path("apps/daemon/src/persistence/migration-definitions.ts").read_text(encoding="utf-8")
          v19 = Path("apps/daemon/src/persistence/migration-v19.test.ts").read_text(encoding="utf-8")
          lifecycle = Path("apps/daemon/src/lifecycle/processor.ts").read_text(encoding="utf-8")
          normalization = Path("apps/daemon/src/normalization/processor.ts").read_text(encoding="utf-8")
          codex_test = Path("apps/daemon/src/normalization/codex-normalization.test.ts").read_text(encoding="utf-8")

          markers = {
              "migration_import_present": (migration, 'import { MULTI_AGENT_EVENT_TAXONOMY_SQL } from "./multi-agent-event-taxonomy-migration.js";'),
              "migration_v19_tail": (migration, '''  Object.freeze({
            version: 19,
            name: "multi_agent_event_source",
            sql: MULTI_AGENT_EVENT_SOURCE_SQL,
            foreignKeyPolicy: "disable_during_table_rebuild",
          }),
          ]);
          '''),
              "v19_full_run_marker": (v19, '''      runMigrations(opened.database);

                expect(readAppliedMigrations(opened.database)).toHaveLength(19);
          '''),
              "lifecycle_projection_start": (lifecycle, "function projectLifecyclePayload("),
              "lifecycle_projection_end": (lifecycle, "\n\nfunction insertResolution"),
              "lifecycle_associated_block": (lifecycle, '''    case "PreToolUse":
              case "PostToolUse":
              case "PostToolUseFailure":
              case "PostToolBatch": {
          '''),
              "normalization_import": (normalization, '''  type NormalizedEventEnvelope,
            type NormalizedEventType,
            type JsonObject,
          '''),
              "normalization_payload_helper": (normalization, '''  return parsed as JsonObject;
          }

          function requirePayloadField(
          '''),
              "normalization_validation_start": (normalization, "function validateSourcePayload("),
              "normalization_validation_end": (normalization, "\n\ntype EventSpecification"),
              "normalization_spec_source": (normalization, '  source: "claude_code" | "ownloop";\n'),
              "normalization_source_spec_start": (normalization, "function sourceSpec("),
              "normalization_source_spec_end": (normalization, "\n\nfunction ownLoopSpec"),
              "normalization_build_start": (normalization, "function buildSpecifications("),
              "normalization_build_end": (normalization, "\n\nfunction eventDeduplicationKey"),
              "normalization_source_version": (normalization, '        sourceVersion: null,\n'),
              "codex_source_count": (codex_test, 'expect(runEvents.filter((event) => event.source === "codex")).toHaveLength(8);'),
          }
          for name, (text, marker) in markers.items():
              print(f"{name}={text.count(marker)}")
          PY
          } > /tmp/ol027-normalization-edit-diagnostics.log 2>&1
          cat /tmp/ol027-normalization-edit-diagnostics.log
          exit 0

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ol027-normalization-edit-diagnostics
          path: /tmp/ol027-normalization-edit-diagnostics.log
          if-no-files-found: error
          retention-days: 1
