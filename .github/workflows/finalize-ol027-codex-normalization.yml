name: Finalize OL-027 Codex normalization

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Apply exact Codex lifecycle normalization edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "909662a11f01f36c9f897d60b76e9e996f333c48"
          python .ol027-transfer/finalize-codex-normalization.py
          python - <<'PY'
          from pathlib import Path

          migration_test = Path("apps/daemon/src/persistence/migration-v20.test.ts")
          migration_text = migration_test.read_text(encoding="utf-8")
          migration_start_marker = "      newTypes.forEach((eventType, index) =>"
          migration_end_marker = "      );\n      expect("
          if migration_text.count(migration_start_marker) != 1:
              raise SystemExit("migration v20 callback start marker failed")
          migration_start = migration_text.index(migration_start_marker)
          migration_end = migration_text.index(migration_end_marker, migration_start)
          migration_replacement = '''      newTypes.forEach((eventType, index) => {
            insertEvent(opened.database, `event-v20-${index}`, index + 2, eventType);
          });
          expect('''
          migration_test.write_text(
              migration_text[:migration_start]
              + migration_replacement
              + migration_text[migration_end + len(migration_end_marker):],
              encoding="utf-8",
          )

          normalization_test = Path("apps/daemon/src/normalization/codex-normalization.test.ts")
          normalization_text = normalization_test.read_text(encoding="utf-8")
          normalization_start_marker = "      hookOrder.forEach((hookName, index) =>"
          normalization_end_marker = (
              '      );\n      process(persistence, nextEventId, '
              '"receipt-codex-normalization-end", "SessionEnd");'
          )
          if normalization_text.count(normalization_start_marker) != 1:
              raise SystemExit("Codex normalization callback start marker failed")
          normalization_start = normalization_text.index(normalization_start_marker)
          normalization_end = normalization_text.index(
              normalization_end_marker,
              normalization_start,
          )
          normalization_replacement = '''      hookOrder.forEach((hookName, index) => {
            process(
              persistence,
              nextEventId,
              `receipt-codex-normalization-${index}`,
              hookName,
            );
          });
          process(
            persistence,
            nextEventId,
            "receipt-codex-normalization-end",
            "SessionEnd",
          );'''
          normalization_test.write_text(
              normalization_text[:normalization_start]
              + normalization_replacement
              + normalization_text[normalization_end + len(normalization_end_marker):],
              encoding="utf-8",
          )
          PY
          rm -rf .ol027-transfer .github/workflows/finalize-ol027-codex-normalization.yml

      - run: pnpm install --frozen-lockfile

      - name: Format normalization source
        run: |
          pnpm exec biome check --write \
            packages/event-model/src/normalized-event.ts \
            packages/event-model/tests/normalized-event.test.ts \
            apps/daemon/src/persistence/multi-agent-event-taxonomy-migration.ts \
            apps/daemon/src/persistence/migration-definitions.ts \
            apps/daemon/src/persistence/migration-v19.test.ts \
            apps/daemon/src/persistence/migration-v20.test.ts \
            apps/daemon/src/lifecycle/processor.ts \
            apps/daemon/src/lifecycle/codex-lifecycle.test.ts \
            apps/daemon/src/normalization/processor.ts \
            apps/daemon/src/normalization/codex-normalization.test.ts

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test taxonomy, lifecycle, and normalization
        run: pnpm vitest run packages/event-model/tests/normalized-event.test.ts apps/daemon/src/persistence/migration-v19.test.ts apps/daemon/src/persistence/migration-v20.test.ts apps/daemon/src/lifecycle/codex-lifecycle.test.ts apps/daemon/src/lifecycle/processor.test.ts apps/daemon/src/normalization/codex-normalization.test.ts apps/daemon/src/normalization/processor.test.ts

      - name: Test full repository
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish clean normalization head
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .ol027-transfer
          test ! -e .github/workflows/finalize-ol027-codex-normalization.yml
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name 'Emad211'
          git config user.email '82148680+Emad211@users.noreply.github.com'
          git commit -m 'OL-027: Normalize Codex lifecycle facts'
          git push origin "HEAD:${{ github.head_ref }}"
