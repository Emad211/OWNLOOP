name: One-shot formatter

on:
  push:
    branches:
      - agent/ol-028-persian-attention-loop-v0
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository formatter
        run: pnpm format

      - name: Remove one-shot workflow
        shell: bash
        run: rm .github/workflows/format-once.yml

      - name: Commit formatted files and self-removal
        shell: bash
        run: |
          git config user.name "ownloop-format-bot"
          git config user.email "ownloop-format-bot@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply Biome formatting"
          git push origin HEAD:agent/ol-028-persian-attention-loop-v0
