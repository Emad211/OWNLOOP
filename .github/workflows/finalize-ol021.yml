name: Finalize OL-021 Moment Interactions

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: finalize-ol021-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/ol-021-moment-interactions'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify exact event head and payload
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(wc -c < .github/ol021.patch.gz)" = '39493'
          echo 'debc88b3af48365bb8bd57924b1991de1a1227c768cf91167e3c0d2030880d44  .github/ol021.patch.gz' | sha256sum -c -
          gzip --decompress --stdout .github/ol021.patch.gz > /tmp/ol021.patch
          test "$(wc -c < /tmp/ol021.patch)" = '198083'
          echo '8423543573ddbfbaa8018eb42ddd8c0b6d97414bcde2c8dbc984b8e632934761  /tmp/ol021.patch' | sha256sum -c -

      - name: Apply exact OL-021 patch and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/ol021.patch
          git apply /tmp/ol021.patch
          rm -f .github/ol021.patch.gz
          rm -f .github/workflows/finalize-ol021.yml
          git diff --check

      - name: Set up exact Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up exact pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit and verify exact final scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'OL-021: Persist append-only Moment interactions'
          git fetch origin main --depth=1
          git diff --check origin/main HEAD
          git diff --name-only origin/main HEAD | LC_ALL=C sort > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          AGENTS.md
          README.md
          apps/daemon/src/candidate-validation/processor.integration.test.ts
          apps/daemon/src/ingress/server.ts
          apps/daemon/src/moment-interactions/README.md
          apps/daemon/src/moment-interactions/constants.ts
          apps/daemon/src/moment-interactions/index.ts
          apps/daemon/src/moment-interactions/processor.test.ts
          apps/daemon/src/moment-interactions/processor.ts
          apps/daemon/src/ownership-moments/projection.ts
          apps/daemon/src/persistence/index.ts
          apps/daemon/src/persistence/migration-definitions.ts
          apps/daemon/src/persistence/migrations.test.ts
          apps/daemon/src/persistence/repositories/moment-interactions.ts
          apps/daemon/src/replay/responses.ts
          apps/daemon/src/replay/routes.ts
          apps/web/src/App.test.tsx
          apps/web/src/App.tsx
          apps/web/src/api.test.ts
          apps/web/src/api.ts
          docs/adr/0023-append-only-moment-interactions-and-ownership-records.md
          packages/contracts/src/index.ts
          packages/contracts/src/moment-interactions.ts
          packages/contracts/src/replay.ts
          packages/contracts/tests/moment-interactions.test.ts
          EOF
          sed -i 's/^          //' /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(wc -l < /tmp/actual-files)" = '25'
          test ! -e .github/ol021.patch.gz
          test ! -e .github/workflows/finalize-ol021.yml
          test ! -e .github/workflows/export-ol021-toolchain.yml
          test -z "$(git status --porcelain)"

      - name: Publish exact verified head
        shell: bash
        run: git push origin HEAD:${{ github.head_ref }}
