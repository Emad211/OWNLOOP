name: Finalize OL-021 Moment Interactions

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: finalize-ol021-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/ol-021-moment-interactions'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify exact event head and transfer chunks
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(wc -c < .github/ol021-transfer/part-00)" = '4000'
          test "$(wc -c < .github/ol021-transfer/part-01)" = '4000'
          test "$(wc -c < .github/ol021-transfer/part-02)" = '4000'
          test "$(wc -c < .github/ol021-transfer/part-03)" = '4000'
          test "$(wc -c < .github/ol021-transfer/part-04)" = '4000'
          test "$(wc -c < .github/ol021-transfer/part-05)" = '4000'
          test "$(wc -c < .github/ol021-transfer/part-06)" = '4000'
          test "$(wc -c < .github/ol021-transfer/part-07)" = '4000'
          test "$(wc -c < .github/ol021-transfer/part-08)" = '4000'
          test "$(wc -c < .github/ol021-transfer/part-09)" = '4000'
          test "$(wc -c < .github/ol021-transfer/part-10)" = '4000'
          test "$(wc -c < .github/ol021-transfer/part-11)" = '4000'
          test "$(wc -c < .github/ol021-transfer/part-12)" = '4000'
          test "$(wc -c < .github/ol021-transfer/part-13)" = '660'
          echo 'e0d07235f8802a95d54240c077cda49d4c3f7b7567a48a97dae7cf636f14a34d  .github/ol021-transfer/part-00' | sha256sum -c -
          echo 'e6a6b26a35304458a82995d8bbc4d3185f3b723549b7ac4ff6e97fb0cfedc5ca  .github/ol021-transfer/part-01' | sha256sum -c -
          echo '8c4bf62ea2025eb4ac6c8521b11d9e9e6418beebd7ca4ace1621aab77b6798f5  .github/ol021-transfer/part-02' | sha256sum -c -
          echo 'f6c15a6bf98f367a86a1f0990f181a33db37e2147dcd72cb588a90e5ea02f170  .github/ol021-transfer/part-03' | sha256sum -c -
          echo 'cfd00fd49d51e85de77bad80877ded550c5c270b853eb8cef3e352fe04aa1a49  .github/ol021-transfer/part-04' | sha256sum -c -
          echo '0e3ef856598fb28d2b8d2418e7df7e90520dce531ee3ae1b9dcfe9ac27d68112  .github/ol021-transfer/part-05' | sha256sum -c -
          echo '06eaa4c03d2efc6d31aebca5798467ffe04c07e225c661d5e489dce6cd6961cc  .github/ol021-transfer/part-06' | sha256sum -c -
          echo '7e7412caad136c31ecf3273dd26a311084e278619bd38aa5b8923980148b03f6  .github/ol021-transfer/part-07' | sha256sum -c -
          echo 'bc07e428c4ca5a04b4ec66ed9927df34064e81534b281b1e51d5bb6dd61c373b  .github/ol021-transfer/part-08' | sha256sum -c -
          echo 'd47095b11c0ee7f0981c25e896d4f8e4a11c7e804c4a9bc51c0215e4b073a9bd  .github/ol021-transfer/part-09' | sha256sum -c -
          echo 'e468851192c15d6fe021690182d0998a372048539d24e9f7bd468b0395df69a8  .github/ol021-transfer/part-10' | sha256sum -c -
          echo 'af7e766c240db019e923a9b229fcf4db734360ebcc736d367c8b1aad63cfeb8c  .github/ol021-transfer/part-11' | sha256sum -c -
          echo 'b2a909397533e45337fdf9496f93082b11b9aab8a8731ee28de9f0eb85e9b88f  .github/ol021-transfer/part-12' | sha256sum -c -
          echo '2da72d022439784076edd87574aa3e2fb9ca0ba3f93ffaf9691e98b53bd7696b  .github/ol021-transfer/part-13' | sha256sum -c -
          cat .github/ol021-transfer/part-{00..13} > /tmp/ol021.patch.gz.b64
          test "$(wc -c < /tmp/ol021.patch.gz.b64)" = '52660'
          echo '138471e3969bddd3eeec1ba822aadccd899cc89d18c808f251ddfa9467943c79  /tmp/ol021.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/ol021.patch.gz.b64 > /tmp/ol021.patch.gz
          test "$(wc -c < /tmp/ol021.patch.gz)" = '39493'
          echo 'debc88b3af48365bb8bd57924b1991de1a1227c768cf91167e3c0d2030880d44  /tmp/ol021.patch.gz' | sha256sum -c -
          gzip --decompress --stdout /tmp/ol021.patch.gz > /tmp/ol021.patch
          test "$(wc -c < /tmp/ol021.patch)" = '198083'
          echo '8423543573ddbfbaa8018eb42ddd8c0b6d97414bcde2c8dbc984b8e632934761  /tmp/ol021.patch' | sha256sum -c -

      - name: Apply exact OL-021 patch and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/ol021.patch
          git apply /tmp/ol021.patch
          rm -f .github/ol021.patch.gz
          rm -rf .github/ol021-transfer
          rm -f .github/workflows/finalize-ol021.yml
          git diff --check

      - name: Set up exact Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up exact pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit and verify exact final scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'OL-021: Persist append-only Moment interactions'
          git fetch origin main --depth=1
          git diff --check origin/main HEAD
          git diff --name-only origin/main HEAD | LC_ALL=C sort > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          AGENTS.md
          README.md
          apps/daemon/src/candidate-validation/processor.integration.test.ts
          apps/daemon/src/ingress/server.ts
          apps/daemon/src/moment-interactions/README.md
          apps/daemon/src/moment-interactions/constants.ts
          apps/daemon/src/moment-interactions/index.ts
          apps/daemon/src/moment-interactions/processor.test.ts
          apps/daemon/src/moment-interactions/processor.ts
          apps/daemon/src/ownership-moments/projection.ts
          apps/daemon/src/persistence/index.ts
          apps/daemon/src/persistence/migration-definitions.ts
          apps/daemon/src/persistence/migrations.test.ts
          apps/daemon/src/persistence/repositories/moment-interactions.ts
          apps/daemon/src/replay/responses.ts
          apps/daemon/src/replay/routes.ts
          apps/web/src/App.test.tsx
          apps/web/src/App.tsx
          apps/web/src/api.test.ts
          apps/web/src/api.ts
          docs/adr/0023-append-only-moment-interactions-and-ownership-records.md
          packages/contracts/src/index.ts
          packages/contracts/src/moment-interactions.ts
          packages/contracts/src/replay.ts
          packages/contracts/tests/moment-interactions.test.ts
          EOF
          sed -i 's/^          //' /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(wc -l < /tmp/actual-files)" = '25'
          test ! -e .github/ol021.patch.gz
          test ! -e .github/ol021-transfer
          test ! -e .github/workflows/finalize-ol021.yml
          test ! -e .github/workflows/export-ol021-toolchain.yml
          test -z "$(git status --porcelain)"

      - name: Publish exact verified head
        shell: bash
        run: git push origin HEAD:${{ github.head_ref }}
