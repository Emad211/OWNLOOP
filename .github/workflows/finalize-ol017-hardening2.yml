name: Finalize OL-017 Hardening 2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/ol-017-reduced-semantic-input'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Verify and apply OL-017 hardening patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ol017-hardening2/part-* > /tmp/ol017-hardening2.b64
          test "$(wc -c < /tmp/ol017-hardening2.b64)" -eq 12960
          base64 --decode /tmp/ol017-hardening2.b64 > /tmp/ol017-hardening2.patch.gz
          test "$(wc -c < /tmp/ol017-hardening2.patch.gz)" -eq 9719
          echo "d807f041fea8e06f4c7bb3dc6e99b1b8c1fabe2040442dcaaba5fe8577c07ebe  /tmp/ol017-hardening2.patch.gz" | sha256sum --check
          gzip --test /tmp/ol017-hardening2.patch.gz
          gzip --decompress --stdout /tmp/ol017-hardening2.patch.gz > /tmp/ol017-hardening2.patch
          test "$(wc -c < /tmp/ol017-hardening2.patch)" -eq 42500
          echo "2463d2387eb22fe002adc9ab99250089f3d73636e0f918946b2c2aa70add124d  /tmp/ol017-hardening2.patch" | sha256sum --check
          git apply --check /tmp/ol017-hardening2.patch
          git apply /tmp/ol017-hardening2.patch

      - name: Set up exact Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up exact pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Format OL-017 hardening
        run: pnpm format

      - name: Remove transfer files and verify exact scope
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/ol017-hardening2/part-*
          git rm .github/workflows/finalize-ol017-hardening2.yml
          cat > /tmp/expected-files <<'FILES'
          .github/ol017-hardening2/part-00
          .github/ol017-hardening2/part-01
          .github/ol017-hardening2/part-02
          .github/ol017-hardening2/part-03
          .github/ol017-hardening2/part-04
          .github/workflows/export-ol017-review.yml
          .github/workflows/finalize-ol017-hardening2.yml
          apps/daemon/src/persistence/migration-definitions.ts
          apps/daemon/src/persistence/migrations.test.ts
          apps/daemon/src/semantic-input/artifact.test.ts
          apps/daemon/src/semantic-input/artifact.ts
          apps/daemon/src/semantic-input/reducer.test.ts
          apps/daemon/src/semantic-input/reducer.ts
          docs/adr/0019-deterministic-reduced-semantic-analysis-input.md
          packages/contracts/src/index.ts
          packages/contracts/src/semantic-analysis-input.ts
          packages/contracts/tests/semantic-analysis-input.test.ts
          FILES
          {
            git diff --name-only
            git diff --cached --name-only
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish OL-017 hardening
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden semantic-input source identity and read-back"
          git push origin "HEAD:${{ github.head_ref }}"
