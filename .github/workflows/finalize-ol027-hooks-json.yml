name: Finalize OL-027 strict Codex hooks JSON

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Apply exact strict JSON wiring
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "fc1c594bc256e8207657f882127ae926db73796d"
          python .ol027-transfer/finalize-hooks-json.py
          rm -rf .ol027-transfer .github/workflows/finalize-ol027-hooks-json.yml

      - run: pnpm install --frozen-lockfile

      - name: Format strict JSON source
        run: |
          pnpm exec biome check --write \
            packages/contracts/src/codex-hook-configuration.ts \
            packages/contracts/src/codex-hook-configuration-json.ts \
            packages/contracts/src/codex.ts \
            packages/contracts/tests/codex-hook-configuration.test.ts \
            packages/contracts/tests/codex-hook-configuration-json.test.ts

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test strict JSON and Hook configuration boundaries
        run: |
          pnpm vitest run \
            packages/contracts/tests/codex-hook-configuration-json.test.ts \
            packages/contracts/tests/codex-hook-configuration.test.ts \
            packages/contracts/tests/codex-capability.test.ts \
            packages/contracts/tests/codex-hook-payloads.test.ts

      - name: Test full repository
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish clean strict JSON head
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .ol027-transfer
          test ! -e .github/workflows/finalize-ol027-hooks-json.yml
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name 'Emad211'
          git config user.email '82148680+Emad211@users.noreply.github.com'
          git commit -m 'OL-027: Add strict Codex Hook configuration JSON'
          git push origin "HEAD:${{ github.head_ref }}"
