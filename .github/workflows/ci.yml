name: Finalize OL-027 package boundary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finalize-ol027-package-boundary
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: agent/ol-027-codex-adapter
          fetch-depth: 4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Apply content-addressed package boundary patch
        shell: bash
        env:
          PERMANENT_CI_HEAD: 33ab7b870bba0509f6d551f690f284f58f143026
          EXPECTED_FINALIZER_BLOB: ed198b166778cf80194157cbcb6c8df642e85cd4
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD^)"
          test "$(git diff --name-only "$parent" HEAD)" = '.ol027-package-boundary-trigger.txt'
          test "$(git rev-parse HEAD^:.ol027-package-finalizer.py)" = "$EXPECTED_FINALIZER_BLOB"
          git fetch --no-tags --depth=1 origin "$PERMANENT_CI_HEAD"
          test "$(git rev-parse FETCH_HEAD)" = "$PERMANENT_CI_HEAD"
          python .ol027-package-finalizer.py
          git checkout "$PERMANENT_CI_HEAD" -- .github/workflows/ci.yml
          rm -f .ol027-package-finalizer.py .ol027-package-boundary-trigger.txt
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Format bounded changed source
        run: pnpm exec biome format --write packages/contracts/src/local-installation.ts packages/contracts/tests/local-installation-codex.test.ts tools/codex-hook-adapter/package.json tools/local-installer/src/codex-hook-launcher.ts tools/local-installer/src/codex-hook-main.ts tools/local-installer/src/index.ts tools/local-installer/src/installer-transaction.ts tools/local-installer/src/package-builder.ts tools/local-installer/tests/codex-launcher-script.test.ts tools/local-installer/tests/package-builder.test.ts

      - name: Validate full repository
        shell: bash
        run: |
          set -euo pipefail
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Publish source-only commit
        shell: bash
        run: |
          set -euo pipefail
          git clean -fdX
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"
          test ! -e .ol027-package-finalizer.py
          test ! -e .ol027-package-boundary-trigger.txt
          git config user.name Emad211
          git config user.email 82148680+Emad211@users.noreply.github.com
          git commit -m 'OL-027: Package stable Codex Hook launcher boundary'
          git push origin HEAD:agent/ol-027-codex-adapter
