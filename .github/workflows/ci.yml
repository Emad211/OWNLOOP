name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  windows-package-smoke:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build verified Windows package
        run: pnpm package:windows
      - name: Smoke-test private Windows ACL boundary
        run: pnpm vitest run tools/local-installer/tests/windows-acl.integration.test.ts
      - name: Prepare isolated install environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = (Resolve-Path 'dist/ownloop-windows-0.1.0').Path
          $localAppData = Join-Path $env:RUNNER_TEMP 'ownloop-localappdata'
          $userProfile = Join-Path $env:RUNNER_TEMP 'ownloop-userprofile'
          New-Item -ItemType Directory -Force -Path $localAppData, $userProfile | Out-Null
          "OWNLOOP_PACKAGE_ROOT=$packageRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LOCALAPPDATA=$localAppData" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "USERPROFILE=$userProfile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install and preflight installed daemon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = Join-Path $env:OWNLOOP_PACKAGE_ROOT 'installer/dist/cli.js'
          $raw = @(& node $cli install)
          if ($LASTEXITCODE -ne 0 -or $raw.Count -ne 1 -or -not (($raw[0] | ConvertFrom-Json).ok)) { throw 'Install failed.' }
      - name: Smoke-test runtime lifecycle and uninstall modes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = Join-Path $env:OWNLOOP_PACKAGE_ROOT 'installer/dist/cli.js'
          function Invoke-OwnLoop([string[]] $Arguments) {
            $raw = @(& node $cli @Arguments); $code = $LASTEXITCODE
            if ($code -ne 0 -or $raw.Count -ne 1) { throw 'OwnLoop command failed.' }
            $value = $raw[0] | ConvertFrom-Json
            if (-not $value.ok) { throw "OwnLoop controlled failure: $($value.error.code)" }
            return $value
          }
          $started = Invoke-OwnLoop @('start')
          Invoke-OwnLoop @('status') | Out-Null
          Invoke-OwnLoop @('stop') | Out-Null
          Invoke-OwnLoop @('uninstall','--preserve-data') | Out-Null

