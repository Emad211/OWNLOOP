name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  windows-package-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build verified Windows package
        run: pnpm package:windows

      - name: Smoke-test private Windows ACL boundary
        run: pnpm vitest run tools/local-installer/tests/windows-acl.integration.test.ts

      - name: Prepare isolated install environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = (Resolve-Path 'dist/ownloop-windows-0.1.0').Path
          $localAppData = Join-Path $env:RUNNER_TEMP 'ownloop-localappdata'
          $userProfile = Join-Path $env:RUNNER_TEMP 'ownloop-userprofile'
          New-Item -ItemType Directory -Force -Path $localAppData, $userProfile | Out-Null

          $codexRoot = Join-Path $userProfile '.codex'
          $codexSettingsPath = Join-Path $codexRoot 'hooks.json'
          New-Item -ItemType Directory -Force -Path $codexRoot | Out-Null
          [ordered]@{
            theme = 'smoke'
            hooks = [ordered]@{
              SessionStart = @(
                [ordered]@{
                  matcher = 'foreign-tool'
                  hooks = @(
                    [ordered]@{
                      type = 'command'
                      command = 'foreign-hook'
                      timeout = 3
                    }
                  )
                }
              )
            }
          } | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $codexSettingsPath -Encoding utf8NoBOM

          "OWNLOOP_PACKAGE_ROOT=$packageRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LOCALAPPDATA=$localAppData" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "USERPROFILE=$userProfile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install and preflight installed daemon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = Join-Path $env:OWNLOOP_PACKAGE_ROOT 'installer/dist/cli.js'

          function Invoke-OwnLoop([string[]] $CommandArguments) {
            $raw = @(& node $cli @CommandArguments)
            $code = $LASTEXITCODE
            if ($raw.Count -ne 1) {
              throw 'OwnLoop returned an invalid output shape.'
            }
            $result = $raw[0] | ConvertFrom-Json
            if ($code -ne 0 -or -not $result.ok) {
              throw "OwnLoop command failed with controlled code: $($result.error.code)"
            }
            return $result
          }

          foreach ($relativePath in @(
            'codex-hook-adapter/dist/index.js',
            'installer/dist/codex-hook-main.js',
            'launchers/installed-ownloop-codex-hook.cmd'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $env:OWNLOOP_PACKAGE_ROOT $relativePath))) {
              throw "Verified package is missing Codex boundary file: $relativePath"
            }
          }

          $firstInstall = Invoke-OwnLoop @('install')
          if ([string]::IsNullOrWhiteSpace($firstInstall.installId)) {
            throw 'Install ID was not returned.'
          }
          $hooks = Invoke-OwnLoop @('hooks', 'status')
          if ($hooks.status -ne 'installed') {
            throw 'Claude and Codex hooks are not installed.'
          }

          $claudeSettingsPath = Join-Path $env:USERPROFILE '.claude/settings.json'
          $claudeSettingsText = Get-Content -LiteralPath $claudeSettingsPath -Raw
          foreach ($forbidden in @('OWNLOOP_INGRESS_PORT', 'OWNLOOP_INSTALLATION_TOKEN', 'secrets-v1.json', 'app\\0.1.0')) {
            if ($claudeSettingsText.Contains($forbidden)) {
              throw 'Claude settings contain forbidden installation data.'
            }
          }

          $stableCodexLauncher = Join-Path $env:LOCALAPPDATA 'OwnLoop/bin/ownloop-codex-hook.cmd'
          if (-not (Test-Path -LiteralPath $stableCodexLauncher)) {
            throw 'Stable Codex Hook launcher was not installed.'
          }
          $codexSettingsPath = Join-Path $env:USERPROFILE '.codex/hooks.json'
          $codexSettingsText = Get-Content -LiteralPath $codexSettingsPath -Raw
          foreach ($forbidden in @(
            'OWNLOOP_INGRESS_PORT',
            'OWNLOOP_INSTALLATION_TOKEN',
            'secrets-v1.json',
            'app\\0.1.0'
          )) {
            if ($codexSettingsText.Contains($forbidden)) {
              throw 'Codex Hooks contain forbidden installation data.'
            }
          }
          if ($codexSettingsText -match '127\.0\.0\.1:\d|localhost:\d') {
            throw 'Codex Hooks contain a forbidden loopback route.'
          }

          $codex = $codexSettingsText | ConvertFrom-Json -AsHashtable
          if ($codex['theme'] -ne 'smoke') {
            throw 'Unrelated Codex root settings were not preserved.'
          }
          $expectedEvents = @(
            'SessionStart',
            'UserPromptSubmit',
            'PreToolUse',
            'PermissionRequest',
            'PostToolUse',
            'PreCompact',
            'PostCompact',
            'SubagentStart',
            'SubagentStop',
            'Stop',
            'SessionEnd'
          )
          $expectedWindowsCommand = [System.IO.Path]::GetFullPath($stableCodexLauncher)
          foreach ($event in $expectedEvents) {
            if (-not $codex['hooks'].Contains($event)) {
              throw "Codex Hooks are missing event: $event"
            }
            $groups = @($codex['hooks'][$event])
            $ownLoopGroups = @()
            foreach ($group in $groups) {
              $handlers = @($group['hooks'])
              if (
                $group['matcher'] -eq '*' -and
                $handlers.Count -eq 1 -and
                $handlers[0]['command'] -eq 'ownloop-codex-hook'
              ) {
                $ownLoopGroups += ,$group
              }
            }
            if ($ownLoopGroups.Count -ne 1) {
              throw "Codex event does not contain exactly one OwnLoop group: $event"
            }
            $ownLoopGroup = $ownLoopGroups[0]
            $handler = @($ownLoopGroup['hooks'])[0]
            if (@($ownLoopGroup.Keys).Count -ne 2 -or @($handler.Keys).Count -ne 6) {
              throw "Codex OwnLoop group has an unexpected shape: $event"
            }
            if (
              $handler['type'] -ne 'command' -or
              $handler['command'] -ne 'ownloop-codex-hook' -or
              [System.IO.Path]::GetFullPath([string]$handler['commandWindows']).ToLowerInvariant() -ne
                $expectedWindowsCommand.ToLowerInvariant() -or
              [int]$handler['timeout'] -ne 5 -or
              [bool]$handler['async'] -ne $false -or
              [int]$handler['additionalContextLimit'] -ne 0
            ) {
              throw "Codex OwnLoop handler is not canonical: $event"
            }
          }
          $sessionStartGroups = @($codex['hooks']['SessionStart'])
          $foreignGroups = @(
            $sessionStartGroups | Where-Object {
              $candidateHandlers = @($_['hooks'])
              $_['matcher'] -eq 'foreign-tool' -and
                $candidateHandlers.Count -eq 1 -and
                $candidateHandlers[0]['command'] -eq 'foreign-hook'
            }
          )
          if ($foreignGroups.Count -ne 1) {
            throw 'Foreign Codex Hook was not preserved during installation.'
          }

          $installManifestPath = Join-Path $env:LOCALAPPDATA 'OwnLoop/install-manifest.json'
          $installManifest = Get-Content -LiteralPath $installManifestPath -Raw |
            ConvertFrom-Json -AsHashtable
          if (
            $installManifest['codexHooks']['command'] -ne 'ownloop-codex-hook' -or
            [System.IO.Path]::GetFullPath(
              [string]$installManifest['codexHooks']['commandWindows']
            ).ToLowerInvariant() -ne $expectedWindowsCommand.ToLowerInvariant()
          ) {
            throw 'Install manifest does not own the stable Codex launcher.'
          }

          $claudeHashBefore = (Get-FileHash -LiteralPath $claudeSettingsPath -Algorithm SHA256).Hash
          $codexHashBefore = (Get-FileHash -LiteralPath $codexSettingsPath -Algorithm SHA256).Hash
          $manifestHashBefore = (Get-FileHash -LiteralPath $installManifestPath -Algorithm SHA256).Hash
          $reinstall = Invoke-OwnLoop @('install')
          if ($reinstall.installId -ne $firstInstall.installId) {
            throw 'Idempotent reinstall rotated the installation identity.'
          }
          if (
            (Get-FileHash -LiteralPath $claudeSettingsPath -Algorithm SHA256).Hash -ne $claudeHashBefore -or
            (Get-FileHash -LiteralPath $codexSettingsPath -Algorithm SHA256).Hash -ne $codexHashBefore -or
            (Get-FileHash -LiteralPath $installManifestPath -Algorithm SHA256).Hash -ne $manifestHashBefore
          ) {
            throw 'Idempotent reinstall changed Hook or ownership bytes.'
          }

          $daemonEntry = Join-Path $env:LOCALAPPDATA 'OwnLoop/app/0.1.0/daemon/dist/main.js'
          $preflightPath = Join-Path $env:RUNNER_TEMP 'ownloop-daemon-preflight.mjs'
          @'
          import { pathToFileURL } from "node:url";
          try {
            const daemon = await import(pathToFileURL(process.argv[2]).href);
            const runtime = await daemon.runInstalledDaemon();
            await runtime.shutdown();
            await new Promise((resolve) => setImmediate(resolve));
            process.stdout.write(
              `${JSON.stringify({
                ok: true,
                activeResources: process.getActiveResourcesInfo().sort(),
              })}\n`,
            );
          } catch (error) {
            const result = {
              ok: false,
              error: {
                name: error instanceof Error ? error.name : "UnknownError",
                code:
                  typeof error === "object" && error !== null && "code" in error
                    ? String(error.code)
                    : null,
                message: error instanceof Error ? error.message : "Unknown startup failure",
              },
            };
            process.stderr.write(`${JSON.stringify(result)}\n`);
            process.exitCode = 1;
          }
          '@ | Set-Content -LiteralPath $preflightPath -Encoding utf8NoBOM

          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = (Get-Command node).Source
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $startInfo.ArgumentList.Add($preflightPath)
          $startInfo.ArgumentList.Add($daemonEntry)
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $startInfo
          if (-not $process.Start()) {
            throw 'Installed daemon preflight process did not start.'
          }
          if (-not $process.WaitForExit(30000)) {
            $process.Kill($true)
            $process.WaitForExit()
            $stdout = $process.StandardOutput.ReadToEnd().Trim()
            $stderr = $process.StandardError.ReadToEnd().Trim()
            throw "Installed daemon preflight timed out. stdout=$stdout stderr=$stderr"
          }
          $stdout = $process.StandardOutput.ReadToEnd().Trim()
          $stderr = $process.StandardError.ReadToEnd().Trim()
          if ($process.ExitCode -ne 0) {
            throw "Installed daemon preflight failed. stdout=$stdout stderr=$stderr"
          }
          $lines = @($stdout -split "`r?`n" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($lines.Count -ne 1) {
            throw 'Installed daemon preflight returned an invalid output shape.'
          }
          $preflightResult = $lines[0] | ConvertFrom-Json
          if (-not $preflightResult.ok) {
            throw 'Installed daemon preflight returned failure.'
          }
          Write-Host "Installed daemon preflight completed; active resources: $($preflightResult.activeResources -join ', ')"

      - name: Smoke-test runtime lifecycle and uninstall modes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = Join-Path $env:OWNLOOP_PACKAGE_ROOT 'installer/dist/cli.js'
          $codexSettingsPath = Join-Path $env:USERPROFILE '.codex/hooks.json'

          function Invoke-OwnLoop([string[]] $CommandArguments) {
            Write-Host "Running OwnLoop command: $($CommandArguments -join ' ')"
            $raw = @(& node $cli @CommandArguments)
            $code = $LASTEXITCODE
            if ($raw.Count -ne 1) {
              throw 'OwnLoop returned an invalid output shape.'
            }
            $result = $raw[0] | ConvertFrom-Json
            if ($code -ne 0 -or -not $result.ok) {
              throw "OwnLoop command failed with controlled code: $($result.error.code)"
            }
            return $result
          }

          function Assert-ForeignCodexOnly {
            if (-not (Test-Path -LiteralPath $codexSettingsPath)) {
              throw 'Unrelated Codex settings file was removed.'
            }
            $text = Get-Content -LiteralPath $codexSettingsPath -Raw
            if ($text.Contains('ownloop-codex-hook')) {
              throw 'OwnLoop Codex Hooks remained after removal.'
            }
            $document = $text | ConvertFrom-Json -AsHashtable
            if ($document['theme'] -ne 'smoke') {
              throw 'Unrelated Codex root setting was changed.'
            }
            $groups = @($document['hooks']['SessionStart'])
            if ($groups.Count -ne 1) {
              throw 'Unexpected SessionStart groups remain after OwnLoop removal.'
            }
            $handlers = @($groups[0]['hooks'])
            if (
              $groups[0]['matcher'] -ne 'foreign-tool' -or
              $handlers.Count -ne 1 -or
              $handlers[0]['command'] -ne 'foreign-hook'
            ) {
              throw 'Foreign Codex Hook was changed.'
            }
          }

          $hookRemoval = Invoke-OwnLoop @('hooks', 'remove')
          if (-not $hookRemoval.changed) {
            throw 'Dual-client Hook removal reported no change.'
          }
          $missingHooks = Invoke-OwnLoop @('hooks', 'status')
          if ($missingHooks.status -ne 'missing') {
            throw 'Removed dual-client Hooks do not report missing.'
          }
          Assert-ForeignCodexOnly
          $hookInstall = Invoke-OwnLoop @('hooks', 'install')
          if (-not $hookInstall.changed) {
            throw 'Dual-client Hook installation reported no change.'
          }
          $installedHooks = Invoke-OwnLoop @('hooks', 'status')
          if ($installedHooks.status -ne 'installed') {
            throw 'Reconciled dual-client Hooks do not report installed.'
          }

          $started = Invoke-OwnLoop @('start')
          if ([string]::IsNullOrWhiteSpace($started.instanceId)) {
            throw 'Runtime instance ID was not returned.'
          }
          $status = Invoke-OwnLoop @('status')
          if ($status.phase -ne 'ready' -or $status.instanceId -ne $started.instanceId) {
            throw 'Runtime status does not match the started instance.'
          }
          Invoke-OwnLoop @('stop') | Out-Null

          $preserved = Invoke-OwnLoop @('uninstall', '--preserve-data')
          if (-not $preserved.dataPreserved -or -not (Test-Path -LiteralPath $preserved.dataPath)) {
            throw 'Preserve-data uninstall did not preserve durable data.'
          }
          Assert-ForeignCodexOnly

          $secondInstall = Invoke-OwnLoop @('install')
          $secondHooks = Invoke-OwnLoop @('hooks', 'status')
          if ($secondHooks.status -ne 'installed') {
            throw 'Reinstall did not restore both Hook clients.'
          }
          $removed = Invoke-OwnLoop @('uninstall', '--remove-data', '--confirm', $secondInstall.installId)
          if ($removed.dataPreserved -or (Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'OwnLoop'))) {
            throw 'Remove-data uninstall left installation state behind.'
          }
          Assert-ForeignCodexOnly
