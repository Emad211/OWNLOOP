name: Finalize OL-027 package boundary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finalize-ol027-package-boundary
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ol-027-codex-adapter' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: agent/ol-027-codex-adapter
          fetch-depth: 4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Apply content-addressed package boundary patch
        shell: bash
        env:
          EXPECTED_FINALIZER_BLOB: ed198b166778cf80194157cbcb6c8df642e85cd4
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD^)"
          test "$(git diff --name-only "$parent" HEAD)" = '.ol027-package-boundary-trigger.txt'
          test "$(git rev-parse HEAD^:.ol027-package-finalizer.py)" = "$EXPECTED_FINALIZER_BLOB"
          python -u .ol027-package-finalizer.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/local-installer/src/codex-hook-launcher.ts')
          source = path.read_text(encoding='utf-8')
          replacements = [
              ('import { spawn } from "node:child_process";\n', 'import { spawn, type ChildProcess } from "node:child_process";\n'),
              ('    let child;\n', '    let child: ChildProcess;\n'),
              (
                  '      child = spawn(executable, [...args], options);\n',
                  '      child = spawn(executable, [...args], {\n        ...options,\n        stdio: ["inherit", "ignore", "ignore"],\n      });\n',
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'unexpected Codex spawn anchor: {old!r}')
              source = source.replace(old, new)
          path.write_text(source, encoding='utf-8')
          PY
          cat > tools/local-installer/scripts/installed-ownloop-codex-hook.cmd <<'EOF'
          @echo off
          node "%LOCALAPPDATA%\OwnLoop\app\0.1.0\installer\dist\codex-hook-main.js" >nul 2>&1
          exit /b 0
          EOF
          cat > packages/contracts/tests/local-installation-codex.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";

          import { OwnLoopInstallManifestV1Schema, SUPPORTED_CLAUDE_HOOK_NAMES } from "../src/index.js";
          import {
            CODEX_HOOK_LAUNCHER_BASENAME,
            SUPPORTED_CODEX_HOOK_NAMES,
          } from "../src/codex.js";

          const manifest = () => ({
            schemaVersion: 1,
            installId: "install_1",
            applicationVersion: "0.1.0",
            releaseDirectoryName: "0.1.0",
            releaseManifestFingerprint: `sha256:${"a".repeat(64)}`,
            installLayoutVersion: 1,
            hooks: SUPPORTED_CLAUDE_HOOK_NAMES.map((event) => ({
              event,
              command: "C:\\Users\\Founder\\AppData\\Local\\OwnLoop\\bin\\ownloop-hook.cmd",
            })),
            claudeSettings: {
              settingsFileCreated: false,
              hooksContainerCreated: false,
              createdEventContainers: [],
            },
            codexHooks: {
              command: CODEX_HOOK_LAUNCHER_BASENAME,
              commandWindows:
                "C:\\Users\\Founder\\AppData\\Local\\OwnLoop\\bin\\ownloop-codex-hook.cmd",
              settings: {
                settingsFileCreated: false,
                hooksContainerCreated: false,
                createdEventContainers: [...SUPPORTED_CODEX_HOOK_NAMES],
              },
            },
            installedAt: "2026-07-26T12:00:00.000Z",
          });

          describe("Codex installation ownership contract", () => {
            it("accepts the stable launcher and canonical event ownership", () => {
              expect(
                OwnLoopInstallManifestV1Schema.parse(manifest()).codexHooks?.settings
                  .createdEventContainers,
              ).toEqual(SUPPORTED_CODEX_HOOK_NAMES);
            });

            it("rejects reordered ownership or a versioned launcher command", () => {
              expect(() =>
                OwnLoopInstallManifestV1Schema.parse({
                  ...manifest(),
                  codexHooks: {
                    ...manifest().codexHooks,
                    settings: {
                      ...manifest().codexHooks.settings,
                      createdEventContainers: [...SUPPORTED_CODEX_HOOK_NAMES].reverse(),
                    },
                  },
                }),
              ).toThrow();
              expect(() =>
                OwnLoopInstallManifestV1Schema.parse({
                  ...manifest(),
                  codexHooks: {
                    ...manifest().codexHooks,
                    commandWindows:
                      "C:\\Users\\Founder\\AppData\\Local\\OwnLoop\\app\\0.1.0\\ownloop-codex-hook.cmd",
                  },
                }),
              ).toThrow();
            });
          });
          EOF
          echo 'package-boundary-patch=applied'
          rm -f .ol027-package-finalizer.py .ol027-package-boundary-trigger.txt
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"
          git diff --cached --name-only | LC_ALL=C sort

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Format bounded changed source
        run: pnpm exec biome format --write packages/contracts/src/local-installation.ts packages/contracts/tests/local-installation-codex.test.ts tools/codex-hook-adapter/package.json tools/local-installer/src/codex-hook-launcher.ts tools/local-installer/src/codex-hook-main.ts tools/local-installer/src/index.ts tools/local-installer/src/installer-transaction.ts tools/local-installer/src/package-builder.ts tools/local-installer/tests/codex-launcher-script.test.ts tools/local-installer/tests/package-builder.test.ts

      - name: Diagnose bounded changed source
        run: pnpm exec biome lint --max-diagnostics=200 packages/contracts/src/local-installation.ts packages/contracts/tests/local-installation-codex.test.ts tools/codex-hook-adapter/package.json tools/local-installer/src/codex-hook-launcher.ts tools/local-installer/src/codex-hook-main.ts tools/local-installer/src/index.ts tools/local-installer/src/installer-transaction.ts tools/local-installer/src/package-builder.ts tools/local-installer/tests/codex-launcher-script.test.ts tools/local-installer/tests/package-builder.test.ts

      - name: Validate full repository
        shell: bash
        run: |
          set -euo pipefail
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Publish source-only commit
        shell: bash
        run: |
          set -euo pipefail
          git clean -fdX
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"
          test ! -e .ol027-package-finalizer.py
          test ! -e .ol027-package-boundary-trigger.txt
          git config user.name Emad211
          git config user.email 82148680+Emad211@users.noreply.github.com
          git commit -m 'OL-027: Package stable Codex Hook launcher boundary'
          git push origin HEAD:agent/ol-027-codex-adapter
